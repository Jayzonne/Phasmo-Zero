12:["사냥 중 목소리는 약 2.5 m 안에서만 들음: 4~6 m 떨어져 숨어서 말해도 오지 않는다.","사냥 외에 근처에서 말하면 더 공격적이 된다.","Kormos (목소리가 아니라 발소리에 반응)."],
13:["속도는 온도에 따라: 따뜻하면 느림(약 1.4 m/s), 추우면 빠름(약 2.7 m/s). 당신을 봐도 가속하지 않음.","두꺼비집이 꺼지면 사냥 중 입김이 보임. 두꺼비집을 다시 켜지 않는다.","Revenant, 차분한 Obambo."],
14:["짧은 배회만 함: 방에서 4 m 넘는 감지기는 사냥·이벤트 외에 작동하지 않는다. 방을 바꾸지 않는다.","증거 없이는 100% 테스트가 없음: 나머지를 모두 제외하면 남는 유령.","Banshee, Yurei, Shade."],
15:["사냥 중 손전등을 켜면: 발소리가 들리기 전에 깜빡인다 (약 12 m에서 들림, 보통 20 m).","파라볼릭 마이크 소리가 더 많다.","Raiju (전자기기 근처에서 가속), Revenant."],
16:["불 켠 양초와 십자가를 나란히: 사냥 대신 양초를 끄고 십자가는 타지 않는다. 세 번째 불꽃을 끈 뒤 사냥.","셀 수 있게 매번 양초를 다시 켜세요.","Demon (자주 사냥, 불꽃으로 막을 수 없음)."],
17:["사냥마다 속도가 다름 (약 1.5 또는 1.9 m/s), 무작위.","두 곳에서 거의 동시에 상호작용.","Obambo (속도가 타이머를 따름), Poltergeist."],
18:["경로에 켜진 전자기기를 두면: 당신을 보지 않아도 그 근처에서 2.5 m/s.","다른 유령보다 먼 거리에서 전자기기를 깜빡이게 한다.","Jinn (두꺼비집에 따라), Myling, Dayan."],
19:["사냥 중 모습이 바뀐다.","손가락 6개 지문, 더 빨리 사라짐 (UV가 있을 때).","Phantom (사진에서 사라짐)."],
20:["증거 0개여도 카메라에 항상 오브가 보인다. 그 방에 카메라를 두세요.","다른 유령의 능력을 따라 하고 게임 중 모델이 바뀐다.","모든 유령."],
21:["0%일 때: 보지 않아도 빠름 (약 2.3 m/s), 보면 약 3.7 m/s까지.","사냥 중 향: 5/6/7초 대신 7.5/9/10.5초 동안 눈이 멂 (I, II, III 단계).","Dayan, 젊은 Thaye, Kormos, Deildegast, Aswang."],
22:["멀리서 매우 빠름 (3 m/s), 바로 옆에서는 거의 멈춤 (0.4 m/s).","항상 플레이어 위치를 앎: 숨어도 소용없음.","Revenant (정반대), Dayan."],
23:["초반에 빠름 (약 2.75 m/s), 나이를 먹으며 1 m/s까지 느려짐. 당신을 봐도 절대 가속하지 않음.","곁에 있으면 나이를 먹는다. 위자보드는 정신력을 소모: 0%면 저주받은 사냥 위험.","Deildegast (물건), Obambo, Deogen."],
25:["십자가·향·소금 없이는 보통 속도. 보호 장비를 쓰면 격노하여 더 빠름 (약 1.96 m/s, 최대 3.2 m/s). 격노 상태 사냥 후에는 약해져 더 느림 (약 1.36 m/s).","격노하면 소금을 건드리지 않고 지나갈 수 있다.","Wraith, Obambo, Demon."],
26:["사냥 중 10 m 이내: 가만히 있으면 1.2 m/s, 움직이면 2.25 m/s.","항상 여성.","Kormos, Deogen, Revenant."],
27:["출구 문을 처음 연 때부터 타이머: 0~1분 차분, 1~3분 공격적, 이후 2분마다 전환. 차분 약 1.45 m/s, 공격적 약 1.96 m/s.","공격적 상태에서 시작한 사냥은 20% 짧다.","The Twins, Gallu, Hantu."],
28:["사냥 중 거의 장님: 5 m 넘게 떨어져 가만히 보이면 무시한다. 발소리 쪽으로 가속 (최대 약 3.7 m/s).","안개나 추격 이벤트를 절대 하지 않는다.","Dayan, Yokai, Oni, Banshee."],
29:["기본 속도가 느림 (약 1.53 m/s). 당신을 보면 어떤 유령보다 빨리 가속 (9초에 약 2.53 m/s). 공식 은신처에서 당신에게 닿으면 사냥이 바로 끝난다.","다음 사냥은 유예 시간 없이 바로 당신의 은신처로.","The Twins (느린 속도), Moroi."],
30:["사냥 시작 시 3 m/s, 사냥 전에 옮긴 서로 다른 집 물건 하나당 0.1 m/s 감소 (최소 0.4). 당신을 봐도 가속하지 않음.","사냥이나 십자가가 탈 때마다 개수가 초기화된다.","Revenant, Deogen, Thaye, Moroi."]}};

g:{0:["Tütsü ve kronometre: 180 saniye av yok (diğerleri 90 sn, Demon 60 sn). 2-3 kez tekrarla.","Başka işaret yok: hız ve davranış normal.","Shade (varlık testi), Demon (60 sn)."],
1:["Tuzun üstünden bozmadan geçer. Geçişi kanıtla: av, olay ya da çizginin hemen arkasındaki sensör. Testten önce haç ya da tütsü yok.","Işınlanma: odasından uzaktaki bir oyuncunun ayağında etkileşimsiz EMF.","Öfkeli Gallu (ilk tuza her zaman basar), Mimic."],
2:["Olay sırasında fotoğraf: anında kaybolur ve fotoğrafta görünmez.","Av sırasında neredeyse hep görünmez.","Obake (fotoğrafta kalır)."],
3:["Odasına on kadar eşyadan yığın yap: birkaçını aynı anda fırlatır.","Avda neredeyse durmadan fırlatır: her 0,5 saniyede yakındaki bir eşyayı fırlatmaya çalışır.","The Twins (iki yerde iki etkileşim), Deildegast."],
4:["Parabolik mikrofon: kendine özgü tiz çığlık. Grupta, av sırasında hedefi olmayan görünür oyuncuyu görmezden gelir.","Her zaman kadın. Odasını hiç değiştirmez ama hedefini izlemek için uzağa gider.","Kormos (hareketsiz herkesi görmezden gelir), Goryo."],
5:["Sigorta açık: seni 3 m'den uzakta görünce 2,5 m/s'ye fırlar, yanına gelince yavaşlar. Sigorta kapalı: normal hız.","Sigorta kutusunu asla kendisi kapatmaz.","Raiju: sigortayı kapat, elektroniği açık bırak."],
6:["Bir ışık aç: bazen bir iki saniye sonra kapatır. Asla ışık açmaz.","Odasının ışığı açıkken çıkar ya da oda değiştirir.","Goryo (ışık açık olsa da odasında kalır)."],
7:["Saklan, sessiz kal, elektroniği kapat: çok yavaş adımlar (1 m/s), seni fark edince bir anda 3 m/s.","Seni kaybedince son konumuna koşar, sonra yine yavaşlar.","Yaşlı Thaye, sıcakta Hantu, Kormos, Deildegast."],
8:["Onunla aynı odada kal: av başlatamaz ve neredeyse hiç etkileşmez.","Çok utangaç, uzaktayken daha aktif. Çağırma çemberinde ya da müzik kutusunda yalnızca gölge olarak görünür.","Spirit (tütsü 180 sn), sakin Obambo, Goryo."],
9:["Tütsü ve kronometre: av 60. saniyeden itibaren mümkün (diğerleri 90 sn).","Haç ona %50 daha uzaktan etki eder. Bir av bittikten 20 saniye sonra yeniden avlanabilir (diğerleri 25 sn).","Onryo (alevler), genç Thaye, Gallu, saldırgan Obambo."],
10:["Odasında tütsü: 90 saniye orada kilitli kalır. Çıkışlara tuz ve sensör koy.","Av VE olay dışında giriş kapısını kapatan tek hayalet.","Goryo (90 saniyede çıkabilir), Shade."],
11:["Sis olayını asla yapmaz.","Avda çok görünür, oyuncuların yanında çok aktif. Avın yaklaşık %60'ında görünür (diğerleri yaklaşık %30).","Kormos (o da sis yapmaz ama asla kovalamaz)."],
12:["Avda sesini yalnızca yaklaşık 2,5 m'den duyar: 4–6 m uzakta saklanıp konuş, sana gelmez.","Av dışında yanında konuşmak onu daha saldırgan yapar.","Kormos (sese değil adımlara tepki verir)."],
13:["Hızı sıcaklığa bağlı: sıcakta yavaş (yaklaşık 1,4 m/s), soğukta hızlı (yaklaşık 2,7 m/s). Seni görünce hızlanmaz.","Sigorta kapalıyken avda soğuk nefesi görünür. Sigortayı asla geri açmaz.","Revenant, sakin Obambo."],
14:["Yalnızca kısa dolaşır: odasından 4 m'den uzak sensörler av ve olay dışında hiç tetiklenmez. Odasını hiç değiştirmez.","Kanıtsız %100 test yok: geri kalan her şey elenince kalan odur.","Banshee, Yurei, Shade."],
15:["Avda fener açıkken: ayak seslerini duymadan önce yanıp söner (yaklaşık 12 m'den duyulur, diğerleri 20 m).","Parabolik mikrofonda daha çok ses çıkarır.","Raiju (elektroniğin yanında hızlanır), Revenant."],
16:["Yanan mum ile haç yan yana: avlanmak yerine mumu söndürür, haç yanmaz. 3. alev söndükten sonra avlanır.","Saymak için mumu her seferinde yeniden yak.","Demon (sık avlanır, alev onu durdurmaz)."],
17:["Her avda farklı hız (yaklaşık 1,5 ya da 1,9 m/s), rastgele.","İki yerde neredeyse aynı anda iki etkileşim.","Obambo (hızı kronometreye bağlı), Poltergeist."],
18:["Yoluna açık elektronik koy: seni görmese de orada 2,5 m/s'ye çıkar.","Elektroniği diğerlerinden daha uzaktan yanıp söndürür.","Jinn (sigortaya bağlı), Myling, Dayan."],
19:["Av sırasında görünüşü değişir.","6 parmaklı izler, daha çabuk kaybolur (UV varsa).","Phantom (fotoğrafta kaybolur)."],
20:["0 kanıtta bile kamerada her zaman küre görünür. Odasına bir kamera koy.","Diğer hayaletlerin yeteneklerini kopyalar ve oyun sırasında model değiştirir.","Tüm hayaletler."],
21:["%0'da: görmeden hızlı (yaklaşık 2,3 m/s), görünce yaklaşık 3,7 m/s'ye kadar.","Avda tütsü: 5/6/7 saniye yerine 7,5/9/10,5 saniye kör (I, II, III. seviye).","Dayan, genç Thaye, Kormos, Deildegast, Aswang."],
22:["Uzaktan çok hızlı (3 m/s), hemen yanında neredeyse duruyor (0,4 m/s).","Oyuncuların yerini her zaman bilir: saklanmak işe yaramaz.","Revenant (tam tersi), Dayan."],
23:["Başta hızlı (yaklaşık 2,75 m/s), yaşlandıkça 1 m/s'ye kadar yavaşlar. Seni görünce asla hızlanmaz.","Yanında kaldıkça yaşlanır. Ouija akıl sağlığına mal olur: %0'da lanetli av riski.","Deildegast (eşyalar), Obambo, Deogen."],
25:["Haç, tütsü ya da tuz yoksa normal hız. Bir korumadan sonra öfkeli ve daha hızlı (yaklaşık 1,96 m/s, 3,2 m/s'ye kadar). Öfkeli bir avdan sonra zayıf ve daha yavaş (yaklaşık 1,36 m/s).","Öfkeliyken tuzu bozmadan üstünden geçebilir.","Wraith, Obambo, Demon."],
26:["Avda 10 m'den yakınken: durursan 1,2 m/s'ye düşer; hareket edersen 2,25 m/s'ye çıkar.","Her zaman kadın.","Kormos, Deogen, Revenant."],
27:["Bir çıkış kapısının ilk açılışından itibaren kronometre: 0–1 dk sakin, 1–3 dk saldırgan, sonra her 2 dakikada değişir. Sakin yaklaşık 1,45 m/s, saldırgan yaklaşık 1,96 m/s.","Saldırgan durumda başlayan avlar %20 daha kısa.","The Twins, Gallu, Hantu."],
28:["Avda neredeyse kör: 5 m'den uzakta hareketsiz ve görünürsen seni görmezden gelir. Ayak seslerine doğru hızlanır (yaklaşık 3,7 m/s'ye kadar).","Sis ya da kovalama olayını asla yapmaz.","Dayan, Yokai, Oni, Banshee."],
29:["Taban hızı yavaş (yaklaşık 1,53 m/s). Seni görünce her hayaletten hızlı hızlanır (9 saniyede yaklaşık 2,53 m/s). Resmî saklanma yerinde sana ulaşırsa av hemen biter.","Sonraki av koruma süresi olmadan, doğrudan saklandığın yere başlar.","The Twins (yavaş hız), Moroi."],
30:["Her avın başında 3 m/s, avdan önce taşınan her farklı ev eşyası için 0,1 m/s eksi (en az 0,4). Seni görünce hızlanmaz.","Sayaç her avdan ya da yanan haçtan sonra sıfırlanır.","Revenant, Deogen, Thaye, Moroi."]}};


const LANGS=[["fr","Français"],["en","English"],["de","Deutsch"],["es","Español"],["it","Italiano"],["pt","Português"],["pl","Polski"],["ro","Română"],["ru","Русский"],["tr","Türkçe"],["zh","中文"],["ko","한국어"]];
const F=[
{k:"P",t:"Preuves",s:"Les preuves classiques, quand ta partie en donne."},
{k:"H",t:"Hors chasse",s:"Ce que tu remarques pendant l'enquête, sans chasse en cours."},
{k:"C",t:"En chasse",s:"Sa vitesse, son apparence, ce que tu entends. Plus risqué."},
{k:"D",t:"Sur la durée",s:"À confirmer sur plusieurs minutes ou plusieurs chasses."}];
const FAM={twop:"C",fuseon:"H",shadow:"B",polthunt:"C",cooldown:"D",multi:"B",door2:"H",six:"B",ev_emf:"P",ev_sb:"P",ev_uv:"P",ev_orb:"P",ev_wr:"P",ev_dots:"P",ev_fr:"P",lighton:"H",fuse:"H",mist:"H",chase:"H",male:"H",two:"H",target:"H",room:"H",door:"H",shy:"B",
norm:"C",slow:"C",fast:"C",los:"C",shape:"C",vis:"C",invis:"C",same:"C",jump:"C",brake:"C",still:"C",jinn:"C",ign:"C",steps:"C",hide:"C",nograce:"C",found:"C",losfast:"C",breath:"C",lamp:"C",voice:"C",blind:"C",salt3:"C",
salt:"B",photo:"B",instoff:"B",leave:"B",i60:"B",i90:"B",i180:"B",iout:"B",flame:"B",cruxfl:"B",third:"B",crux:"B",rage:"B",far:"B",scream:"B",elec:"B",orb:"B",
vary:"D",cold:"D",age:"D",cycle:"D",objslow:"D",tp:"D",th50:"D",th35:"D"};
const ALL=C.flatMap(x=>x.l.map(o=>Object.assign(o,{cat:x.c,sane:x.sane,evc:x.evc})));
/* barré = exclusion directe, même pour les signes rares */
/* "Non" n'exclut que lorsque l'absence est une vraie preuve */
const NONE=new Set(["mist","chase","far","iout"]);
ALL.forEach(o=>{if(NONE.has(o.k))delete o.n});
const AUTO={shape:{e:[19]},third:{e:[16]},i180:{e:[0]},jump:{e:[7]},th35:{e:[8]}};
ALL.forEach(o=>{if(!o.n&&AUTO[o.k])o.n=AUTO[o.k]});
/* signes incompatibles : en cocher un barre les autres */
const EXCL={th50:["th35"],th35:["th50"],norm:["slow","fast"],slow:["norm"],fast:["norm"],vis:["invis"],invis:["vis"]};
const EQ=[["sel","Sel"],["encens","Encens"],["crucifix","Crucifix"],["bougie","Bougie et briquet"],["photo","Appareil photo"],["micro","Micro parabolique"],["detect","Détecteurs de mouvement"],["camera","Caméra vidéo"]];
const EQN=Object.fromEntries(EQ);
const DEF={start:0,pills:0,drain:0,ev:0,fuse:"ok",pl:"group",eq:Object.fromEntries(EQ.map(e=>[e[0],1]))};
const REQ={twop:{group:1},six:{evn:1},lighton:{fuse:1},instoff:{fuse:1},leave:{fuse:1},fuse:{fuse:1},jinn:{fuse:1},target:{group:1},
salt:{eq:["sel"]},salt3:{eq:["sel"]},photo:{eq:["photo"]},i60:{eq:["encens"]},i90:{eq:["encens"]},i180:{eq:["encens"]},iout:{eq:["encens"]},blind:{eq:["encens"]},
rage:{eq:["sel","encens","crucifix"]},crux:{eq:["crucifix"]},cruxfl:{all:["crucifix","bougie"]},flame:{eq:["bougie"]},third:{eq:["bougie"]},far:{eq:["detect"]},scream:{eq:["micro"]},orb:{eq:["camera"],ev0:1}};
let st={on:{},man:{},zero:true,mim:true,set:null,lang:null};
try{const s=JSON.parse(localStorage.getItem("phj3")||"null");if(s)st=Object.assign(st,s)}catch(e){}
if(!st.lang||!I[st.lang]){const n=((navigator.language||"fr").slice(0,2)).toLowerCase();st.lang=I[n]?n:"fr"}
const L=()=>I[st.lang]||I.fr;
const U=k=>(L().u[k]!==undefined?L().u[k]:I.fr.u[k]);
const FR=()=>st.lang==="fr";
const gname=g=>FR()?g.fr:g.en;const gsub=g=>FR()?g.en:g.fr;
const NM=i=>gname(GB[i]);
const ST=o=>{if(FR())return [o.t,o.s||""];const s=L().s&&L().s[o.k];return s?[s[0],s[1]||""]:[o.t,o.s||""]};
const GT=g=>FR()?[g.t,g.b,g.c]:((L().g||{})[g.id]||[g.t,g.b,g.c]);
const CATN=c=>{if(FR())return c;const i=C.findIndex(x=>x.c===c);return (L().cat||[])[i]||c};
const FAMT=f=>(L().fam||I.fr.fam)[f.k];
const EQT=e=>(L().eq||I.fr.eq)[e];
const colon=()=>FR()?" :":":";
const qv=()=>{const e=document.getElementById("fs");return e&&e.value?e.value.trim().toLowerCase():""};
const fixSet=()=>{st.set=Object.assign({},DEF,st.set||{});st.set.eq=Object.assign({},DEF.eq,(st.set&&st.set.eq)||{});st.zero=+st.set.start===0&&+st.set.pills===0};fixSet();
const save=()=>{try{localStorage.setItem("phj3",JSON.stringify(st))}catch(e){}};
const $=s=>document.querySelector(s);
const val=k=>st.on[k]||0;
const vis=o=>!(o.sane&&st.zero)&&!(o.evc&&!+st.set.ev);
function na(o){const r=REQ[o.k];if(!r)return "";const s=st.set;
  if(r.fuse&&s.fuse==="broken")return U("rFuse");
  if(r.group&&s.pl==="solo")return U("rSolo");
  if(r.ev0&&+s.ev>0)return U("rEv");
  if(r.evn&&!+s.ev)return U("rNoEv");
  if(r.eq&&!r.eq.some(e=>s.eq[e]))return U("rMiss")+r.eq.map(EQT).join(U("or"))+".";
  if(r.all&&!r.all.every(e=>s.eq[e]))return U("rMiss")+r.all.filter(e=>!s.eq[e]).map(EQT).join(U("and"))+".";
  return ""}
const keepOf=x=>{let a=x.o?x.o.slice():x.h?x.h.slice():null;if(a&&x.nz&&!st.zero)a=a.concat(x.nz);return a};
const elimOf=x=>{let a=x.e?x.e.slice():null;if(a&&x.z&&st.zero)a=a.concat(x.z);return a};
const eff=x=>{const k=keepOf(x),e0=elimOf(x);if(!k&&!e0)return "";return k?U("keep")+' '+(k.length>6?k.length:k.map(NM).join(", ")):U("excl")+' '+elimOf(x).map(NM).join(", ")};
const tag=(o,a,b)=>(eff(o)?'<span class="tag '+(o.e?"t-elim":"t-only")+'">'+(a||U("chk"))+' '+eff(o)+'</span>':'')+(o.n?'<span class="tag t-no">'+(b||U("strk"))+' '+eff(o.n)+'</span>':'');
const targets=o=>{const s=new Set();[o,o.n].forEach(x=>{if(!x)return;["o","e","h","z","nz"].forEach(f=>(x[f]||[]).forEach(i=>s.add(i)))});return [...s]};
function calc(){
  const act=ALL.filter(o=>val(o.k)&&vis(o)).map(o=>val(o.k)>0?{o,x:o,lb:ST(o)[0]}:o.n?{o,x:o.n,lb:U("notdo")+ST(o)[0]}:null).filter(Boolean);
  return G.map(g=>{const why=[];
    act.forEach(a=>{if(st.mim&&g.id===20&&!a.o.m)return;
      const k=keepOf(a.x),e=elimOf(a.x);
      if(k&&!k.includes(g.id))why.push(a.lb);
      if(e&&e.includes(g.id))why.push(a.lb)});
    if(st.man[g.id])why.unshift(U("manual"));
    return {g,why}});
}
let REM=new Set();
const useful=o=>val(o.k)!==0||targets(o).some(i=>REM.has(i)&&!(i===20&&st.mim&&!o.m));
const evFull=o=>{const n=+st.set.ev;if(!o.evc||!n)return "";const got=ALL.filter(x=>x.evc&&val(x.k)>0).length;return got>=n?U("evfull")(n):""};
const obRow=(o,w)=>{const v=val(o.k),d=w?" disabled":"",tx=ST(o);return '<div class="row'+(v>0?" yes":v<0?" no":"")+(w?" off":"")+'"><div><b>'+tx[0]+'</b>'+tag(o,U("yes")+colon(),U("no")+colon())+(tx[1]?'<small>'+tx[1]+'</small>':'')+(w?'<small class="why2">'+w+'</small>':'')+'</div><div class="seg" role="group" aria-label="'+tx[0].replace(/"/g,"")+'"><button type="button" class="y" data-k="'+o.k+'" data-v="1" aria-pressed="'+(v>0)+'"'+d+'>'+U("yes")+'</button><button type="button" class="n" data-k="'+o.k+'" data-v="-1" aria-pressed="'+(v<0)+'"'+d+'>'+U("no")+'</button></div></div>'};
const why=o=>val(o.k)?"":(na(o)||evFull(o)||(useful(o)?"":U("useless")));
const obH=o=>obRow(o,why(o));
const obYN=(o,off)=>obRow(o,val(o.k)?"":(na(o)||(off?U("useless"):"")));
function drawObs(left){
  const open={};document.querySelectorAll("#obs details[data-id]").forEach(d=>open[d.dataset.id]=d.open);
  const isOpen=(id,def)=>id in open?open[id]:def;
  REM=new Set(left.map(x=>x.g.id));
  $("#obs").innerHTML=
  F.map((f,fi)=>{
    const q=qv();const subs=C.map(x=>({x,l:x.l.filter(o=>FAM[o.k]===f.k&&vis(o)&&!(st.hideOff&&why(o))&&(!q||(ST(o).join(" ")+" "+CATN(x.c)+" "+o.t).toLowerCase().includes(q)))})).filter(y=>y.l.length);
    if(!subs.length)return "";
    const fid="f"+f.k;
    const cnt=ALL.filter(o=>FAM[o.k]===f.k&&vis(o)&&val(o.k)).length;
    return '<details class="fam" data-id="'+fid+'"'+(q||isOpen(fid,f.k==="P"||f.k==="H")?" open":"")+'><summary><span><h3>'+FAMT(f)[0]+'</h3><small class="fs">'+FAMT(f)[1]+'</small></span><span class="n">'+(cnt?U("answers")(cnt):U("signs")(subs.reduce((a,y)=>a+y.l.length,0)))+'</span></summary>'+
      subs.map(y=>{const sid=fid+"-"+y.x.c;return '<details class="sub" data-id="'+sid+'"'+(q||isOpen(sid,true)?" open":"")+'><summary><h4>'+CATN(y.x.c)+'</h4></summary>'+y.l.map(obH).join("")+'</details>'}).join("")+'</details>'}).join("");
  let hidden=0;
  const bs=C.map(x=>({x,l:x.l.filter(o=>FAM[o.k]==="B"&&vis(o)&&useful(o))})).filter(y=>y.l.length).map(y=>{const imp=o=>!val(o.k)&&na(o);const u=y.l.filter(o=>!imp(o)),off=st.hideOff?[]:y.l.filter(imp);hidden+=off.length;return {x:y.x,u,off}}).filter(y=>y.u.length||y.off.length);
  $("#sb").innerHTML=bs.length?bs.map(y=>'<div class="sbox'+(y.u.length?"":" alloff")+'"><h4>'+CATN(y.x.c)+'</h4>'+y.u.map(o=>obRow(o,"")).join("")+y.off.map(o=>obRow(o,na(o))).join("")+'</div>').join(""):'<p class="hid">'+U("noSimple")+'</p>';
  $("#sh").textContent=hidden?U("greyed")(hidden):"";
}
function draw(){
  const r=calc(),left=r.filter(x=>!x.why.length);
  drawObs(left);
  $("#nb").textContent=left.length;{const pn=U("possN");$("#nbt").textContent=left.length===1?U("poss1"):(typeof pn==="function"?pn(left.length):pn)}
  $("#gl").innerHTML=r.map(x=>'<button class="g'+(x.why.length?" out":"")+'" data-g="'+x.g.id+'" title="'+(x.why.length?x.why.join(" · ").replace(/"/g,""):U("clickStrike"))+'"><span><span class="gn">'+gname(x.g)+'</span><span class="en">'+(x.why.length?'':gsub(x.g))+'</span>'+(x.why.length?'<span class="why">'+x.why[0]+'</span>':'')+'</span></button>').join("");
  const vd=$("#vd");
  if(left.length===1){vd.style.display="block";vd.textContent=U("v1")(gname(left[0].g))}
  else if(!left.length){vd.style.display="block";vd.textContent=U("v0")}
  else vd.style.display="none";
  $("#tt").textContent=left.length?U("testsN")(left.length):U("testsH");
  $("#cards").innerHTML=left.length?left.map(x=>{const tx=GT(x.g);return '<article class="card"><h3>'+gname(x.g)+'<span class="en">'+gsub(x.g)+'</span></h3><p><span class="lb">'+U("testLb")+'</span>'+tx[0]+'</p><p class="sp">'+tx[1]+'</p><p class="sp"><b>'+U("confuse")+'</b> '+tx[2]+'</p></article>'}).join(""):'<p class="empty">'+U("empty")+'</p>';
}
function idFind(){const v=$("#q").value.trim(),out=$("#qr");
  if(!v){out.textContent=U("findHelp");return}
  if(v==="24"){out.innerHTML="<b>24</b> : "+U("none24");return}
  const nrm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const m=G.filter(g=>String(g.id)===v||nrm(g.fr).includes(nrm(v))||nrm(g.en).includes(nrm(v)));
  out.innerHTML=m.length?m.slice(0,4).map(g=>"<b>"+gname(g)+"</b> = "+gsub(g)+" (ID "+g.id+")").join(" · "):U("noMatch")}
function setAns(k,v){if(val(k)===v)delete st.on[k];else{st.on[k]=v;if(v>0)(EXCL[k]||[]).forEach(x=>{st.on[x]=-1})}}
const onAns=e=>{const b=e.target.closest("[data-v]");if(!b||b.disabled)return;const k=b.dataset.k,v=+b.dataset.v;setAns(k,v);save();draw();
  const nb=document.querySelector('[data-k="'+k+'"][data-v="'+v+'"]');if(nb)nb.focus()};
$("#obs").addEventListener("click",onAns);$("#sb").addEventListener("click",onAns);
$("#gl").addEventListener("click",e=>{const b=e.target.closest("[data-g]");if(!b)return;const id=b.dataset.g;if(st.man[id])delete st.man[id];else st.man[id]=1;save();draw()});
$("#mim").checked=st.mim;
$("#fs").addEventListener("input",()=>drawObs(calc().filter(x=>!x.why.length)));
const SEL=()=>[["start",U("lStart"),[[0,"0 %"],[25,"25 %"],[50,"50 %"],[75,"75 %"],[100,"100 %"]]],
["pills",U("lPills"),[[0,U("oNone")],[1,U("oYes")]]],
["drain",U("lDrain"),[[0,U("oNone")],[0.5,U("oSlow")],[1,U("oNormal")],[2,U("oFast")]]],
["ev",U("lEv"),[[0,"0"],[1,"1"],[2,"2"],[3,"3"]]],
["fuse",U("lFuse"),[["ok",U("oFuseOk")],["broken",U("oFuseBroken")]]],
["pl",U("lPl"),[["solo",U("oSolo")],["group",U("oGroup")]]]];
function drawSets(){const s=st.set;
  $("#sets").innerHTML='<div class="sgr">'+SEL().map(f=>'<label class="fld"><span>'+f[1]+'</span><select data-s="'+f[0]+'">'+f[2].map(o=>'<option value="'+o[0]+'"'+(String(s[f[0]])===String(o[0])?" selected":"")+'>'+o[1]+'</option>').join("")+'</select></label>').join("")+'</div>'+
  '<div class="eqt">'+U("eqTitle")+'</div><div class="eqs">'+EQ.map(e=>'<label class="eqc"><input type="checkbox" data-eq="'+e[0]+'"'+(s.eq[e[0]]?" checked":"")+'> '+EQT(e[0])+'</label>').join("")+'</div><p class="sinfo">'+info()+'</p>';
  $("#setsum").textContent=U("sum")(s)}
function info(){const s=st.set,m=[];
  if(st.zero)m.push(U("iZero"));
  else if(+s.drain===0)m.push(U("iDrain0"));
  else m.push(U("iNorm"));
  if(+s.ev>0)m.push(U("iEv"));
  if(s.fuse==="broken")m.push(U("iFuse"));
  if(s.pl==="solo")m.push(U("iSolo"));
  return m.join(" ")}
$("#sets").addEventListener("change",e=>{const el=e.target;
  if(el.dataset.s){const v=el.value;st.set[el.dataset.s]=isNaN(+v)?v:+v}
  if(el.dataset.eq)st.set.eq[el.dataset.eq]=el.checked?1:0;
  fixSet();save();drawSets();draw()});
function applyStatic(){document.documentElement.lang=st.lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=U(el.dataset.i);if(typeof v==="string")el.textContent=v});
  document.querySelectorAll("[data-ip]").forEach(el=>{el.placeholder=U(el.dataset.ip)});
  $("#lcode").textContent=st.lang.toUpperCase();$("#lng").setAttribute("aria-label",U("lang"));document.querySelector(".langpick").title=U("lang");
  $("#lng").innerHTML=LANGS.map(l=>'<option value="'+l[0]+'"'+(l[0]===st.lang?" selected":"")+'>'+l[1]+'</option>').join("");
  idFind()}
$("#lng").addEventListener("change",e=>{st.lang=e.target.value;save();applyStatic();drawSets();draw()});
applyStatic();
drawSets();
$("#mim").addEventListener("change",e=>{st.mim=e.target.checked;save();draw()});
$("#hideoff").checked=!!st.hideOff;$("#hideoff").addEventListener("change",e=>{st.hideOff=e.target.checked;save();draw()});
$("#reset").addEventListener("click",()=>{st.on={};st.man={};save();draw()});
$("#q").addEventListener("input",idFind);
draw();
}
</script>
