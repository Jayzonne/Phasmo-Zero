<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phasmo Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: carnet de terrain d'un chasseur, lu à la lampe UV dans le camion
   IDEA: le journal du jeu — on coche ce qu'il fait, on barre ce qu'il ne fait pas
   PICTURE: la grille des 30 entités qui se barre en direct, à côté des signes
   COLOUR and TYPE: nuit #101118, violet UV #9a6bff, crayon rouge #ff5a4e ; Kalam + Atkinson Hyperlegible
   LAYOUT: barre d'outils, deux pages (signes | entités), tests en bas ; empilé sous 900px */
:root{color-scheme:light dark;
--bg:light-dark(#f3f2f7,#101118);--page:light-dark(#ffffff,#181a24);--ink:light-dark(#1b1a24,#e9e7f2);
--mute:light-dark(#5d5a6e,#a19eb4);--line:light-dark(#dcd9e6,#2b2d3c);--uv:light-dark(#5a2fd0,#9a6bff);
--uvbg:light-dark(#efe8ff,#221c3a);--red:light-dark(#c4271c,#ff5a4e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,"Noto Sans","PingFang SC","Malgun Gothic",sans-serif;overflow-x:clip}
h1,h2,h3,.gn{font-family:Kalam,"Comic Sans MS",cursive;font-weight:700}
h1{font-size:clamp(30px,4vw,44px);line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:26px;line-height:1.1;margin:0 0 10px}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(16px,3vw,32px) max(4vw,14px)}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.top p{margin:6px 0 0;color:var(--mute);max-width:62ch}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{display:flex;align-items:center;gap:8px;background:var(--page);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;cursor:pointer;font-size:15px}
.sw input{width:20px;height:20px;accent-color:var(--uv)}
button{font:inherit;color:inherit;cursor:pointer}
.pri{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--uv);background:var(--uv);color:#fff}
:focus-visible{outline:3px solid var(--uv);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.pg{background:var(--page);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.side{position:sticky;top:12px}
details{border-top:1px solid var(--line)}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 2px;min-height:44px}
summary::-webkit-details-marker{display:none}
summary h3{margin:0;font-size:21px}
summary .n{font-size:13px;color:var(--uv);background:var(--uvbg);border-radius:20px;padding:2px 9px;white-space:nowrap}
summary::after{content:"+";font-size:22px;color:var(--mute);width:20px;text-align:center}
details[open]>summary::after{content:"−"}
.fam>summary{padding:14px 2px}
.fam>summary h3{font-size:26px}
.fs{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.sub{margin:0 0 6px 10px;border-top:1px dashed var(--line)}
.sub>summary{padding:8px 2px;min-height:40px}
.sub h4{margin:0;font-size:16px;font-weight:700;color:var(--uv)}
.sub>summary::after{font-size:18px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--mute);padding-bottom:10px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.ob{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;padding:9px 6px;border-radius:9px;width:100%;text-align:left;border:0;background:transparent;min-height:44px}
.ob:hover{background:var(--uvbg)}
.bx{width:24px;height:24px;border:2px solid var(--mute);border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:16px;line-height:1;margin-top:1px}
.leg .bx{width:20px;height:20px;font-size:13px}
.ob.yes .bx,.bx.y{background:var(--uv);border-color:var(--uv);color:#fff}
.ob.no .bx,.bx.x{border-color:var(--red);color:var(--red)}
.ob.no b{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;color:var(--mute)}
.ob b{font-weight:700}
.ob small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:1px}
.t-only{background:var(--uvbg);color:var(--uv)}.t-elim{background:light-dark(#ffe3df,#3a1a18);color:var(--red)}.t-no{background:light-dark(#f1eef6,#26283a);color:var(--mute)}
.simple{margin-top:18px}.sp0{color:var(--mute);margin:0 0 10px}#sh{display:block;font-size:13px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.sbox{border:1px solid var(--line);border-radius:12px;padding:8px 8px 4px}.sbox h4{margin:2px 6px 4px;font-size:16px;color:var(--uv)}
@media(max-width:600px){.sgrid{grid-template-columns:minmax(0,1fr)}}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-radius:10px}
.row+.row{border-top:1px solid var(--line)}
.row.yes{background:var(--uvbg)}.row.no{background:light-dark(#ffe9e6,#331a19)}
.row b{font-weight:700}
.row.no b{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;color:var(--mute)}
.row small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--page);min-width:52px;min-height:44px;font-size:14px;font-weight:700;color:var(--mute)}
.seg button+button{border-left:1px solid var(--line)}
.seg .y[aria-pressed=true]{background:var(--uv);color:#fff}
.seg .n[aria-pressed=true]{background:var(--red);color:#fff}
.row.off{opacity:.42}.row.off b{font-weight:400}.why2{font-style:italic}
.seg button:disabled{cursor:not-allowed;background:transparent}
.sbox.alloff h4{color:var(--mute)}
.langpick{position:fixed;top:10px;right:10px;z-index:50;display:flex;align-items:center;gap:6px;background:var(--uv);color:#fff;border-radius:999px;padding:4px 6px 4px 12px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;min-height:44px}
.langpick svg{width:20px;height:20px;flex:none}
.langpick .lcode{font-weight:700;font-size:14px;letter-spacing:.02em}
.langpick select{font:inherit;font-size:15px;color:#fff;background:rgba(255,255,255,.16);border:0;border-radius:999px;padding:6px 10px;min-height:34px;cursor:pointer}
.langpick select option{color:#1b1a24;background:#fff}
.langpick:focus-within{outline:3px solid light-dark(#d9ccff,#3a2c6b);outline-offset:2px}
.wrap{padding-top:max(60px,clamp(16px,3vw,32px))}
.setp{margin-bottom:18px;padding:4px 18px 14px;--rd:light-dark(#a8443b,#d4837a);border:2px solid var(--rd);background:light-dark(#fcf1ef,#22171a)}
.setp>summary h3{color:var(--rd)}.setp .fs{color:light-dark(#7d4a44,#c9a39e)}
.setp .fld span,.setp .eqt{color:light-dark(#7d4a44,#c9a39e)}
.setp .fld select{border-color:light-dark(#e2bdb7,#5a3632);background:var(--page)}
.setp .eqc{border-color:light-dark(#e2bdb7,#5a3632);background:var(--page)}.setp .eqc input{accent-color:var(--rd)}
.setp .sinfo{color:var(--rd)}.setp>summary::after{color:var(--rd)}
.lng select{font:inherit;font-size:15px;border:0;background:transparent;color:var(--ink);min-height:30px;cursor:pointer}
.setp>summary h3{font-size:24px}
.sgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 14px;margin-top:4px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}
.fld select{font:inherit;font-size:16px;min-height:44px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.eqt{font-size:14px;color:var(--mute);margin:14px 0 6px}
.eqs{display:flex;flex-wrap:wrap;gap:6px}
.eqc{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;padding:6px 12px;min-height:40px;font-size:14px;cursor:pointer}
.eqc input{width:18px;height:18px;accent-color:var(--uv)}
.sinfo{margin:12px 0 0;font-size:14px;color:var(--uv)}
.ob.na{opacity:.42}.ob:disabled{cursor:not-allowed}.ob.na:hover{background:transparent}
.sbar{display:block;position:sticky;top:0;z-index:2;background:var(--page);padding:2px 0 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.slb{display:block;font-family:Kalam,cursive;font-weight:700;font-size:20px;color:var(--uv);margin-bottom:4px}
.sin{position:relative;display:block}
.sin svg{position:absolute;left:14px;top:50%;width:22px;height:22px;transform:translateY(-50%);color:var(--uv);pointer-events:none}
.sin input{width:100%;font:inherit;font-size:17px;min-height:52px;padding:10px 14px 10px 46px;border-radius:12px;border:2px solid var(--uv);background:var(--uvbg);color:var(--ink)}
.sin input::placeholder{color:var(--mute)}
.sin input:focus{outline:none;box-shadow:0 0 0 4px light-dark(#d9ccff,#3a2c6b)}
.hid{font-size:13px;color:var(--mute);margin:4px 0 8px 10px}
.count{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.count strong{font-family:Kalam,cursive;font-size:clamp(40px,6vw,56px);line-height:1;color:var(--uv)}
.ghosts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.g{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-items:center;text-align:left;padding:6px 8px;border-radius:9px;min-height:48px;background:transparent;border:1px solid var(--line)}
.g .id{font-size:13px;font-weight:700;text-align:center;border-radius:7px;padding:3px 0;background:var(--uvbg);color:var(--uv);font-variant-numeric:tabular-nums}
.g .gn{font-size:19px;line-height:1.05;display:block}
.g .en{font-size:12px;color:var(--mute);display:block}
.g.out{opacity:.55}
.g.out .gn{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:3px}
.g.out .id{background:transparent;color:var(--mute)}
.why{font-size:12px;color:var(--red);display:block;line-height:1.25;margin-top:2px}
.verdict{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--uvbg);color:var(--uv);font-weight:700;display:none}
.idf input{width:100%;font:inherit;font-size:16px;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:14px}
.idr{min-height:22px;font-size:15px;color:var(--mute);margin:6px 0}
.idr b{color:var(--uv)}
.idt{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:2px 10px;font-size:13px;color:var(--mute);margin-top:6px}
.idt span b{display:inline-block;width:24px;text-align:right;margin-right:6px;color:var(--ink);font-variant-numeric:tabular-nums}
.tests{margin-top:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--page);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h3{margin:0;font-size:24px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.card h3 .id{font-family:"Atkinson Hyperlegible",sans-serif;font-size:13px;color:var(--uv);background:var(--uvbg);border-radius:6px;padding:1px 7px}
.card h3 .en{font-family:"Atkinson Hyperlegible",sans-serif;font-size:13px;color:var(--mute);font-weight:400}
.card p{margin:8px 0 0;font-size:15px}
.card .lb{font-weight:700;color:var(--uv)}
.card .sp{color:var(--mute);font-size:14px}
.empty{color:var(--mute)}
.note{color:var(--mute);font-size:13px;margin-top:14px}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.side{position:static;order:-1}}
@media(max-width:600px){.cards{grid-template-columns:minmax(0,1fr)}.g{grid-template-columns:minmax(0,1fr);gap:2px;padding:6px}.g .id{width:30px}.g .gn{font-size:17px}}
@media(prefers-reduced-motion:no-preference){.g{transition:opacity .25s,background .25s}}
</style>
</head>
<body>
<label class="langpick" for="lng"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c2.6 2.8 2.6 15.2 0 18M12 3c-2.6 2.8-2.6 15.2 0 18" fill="none" stroke="currentColor" stroke-width="2"/></svg><span class="lcode" id="lcode">FR</span><select id="lng"></select></label>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Phasmo Zero</h1>
      <p><b data-i="tag"></b> <span data-i="intro"></span></p>
    </div>
    <div class="tools">
            <label class="sw"><input type="checkbox" id="mim"> <span data-i="mim"></span></label>
      <label class="sw"><input type="checkbox" id="hideoff"> <span data-i="hideOff"></span></label>
      <button id="reset" class="pri" data-i="reset"></button>
    </div>
  </div>

  <details class="pg setp" id="setp" open><summary><span><h3 data-i="settings"></h3><small class="fs" id="setsum"></small></span></summary><div id="sets"></div></details>

  <div class="grid">
    <div class="pg"><label class="sbar" for="fs"><span class="slb" data-i="searchLbl"></span><span class="sin"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><input id="fs" type="search" data-ip="searchPh" autocomplete="off"></span></label><div id="obs"></div></div>
    <aside class="pg side">
      <div class="count"><strong id="nb">30</strong><span id="nbt"></span></div>
      <div class="ghosts" id="gl"></div>
      <div class="verdict" id="vd"></div>
      <div class="idf"><input id="q" type="search" data-ip="findPh" autocomplete="off"></div>
      <div class="idr" id="qr"></div>
    </aside>
  </div>

  <section class="pg simple">
    <h2 data-i="simpleH"></h2>
    <p class="sp0"><span data-i="simpleP"></span> <span id="sh"></span></p>
    <div class="sgrid" id="sb"></div>
  </section>

  <section class="tests">
    <h2 id="tt"></h2>
    <div class="cards" id="cards"></div>
    <p class="note" data-i="note"></p>
  </section>
</div>

<script>
{
const G=[
{id:0,fr:"Esprit",en:"Spirit",t:"Encens, puis chrono : aucune chasse avant 180 s (90 s pour les autres, 60 s pour le Démon). Répète 2 ou 3 fois.",b:"Aucun autre signe : vitesse et comportement normaux.",c:"Ombre (test de présence), Démon (60 s)."},
{id:1,fr:"Spectre",en:"Wraith",t:"Passe sur du sel sans le déranger. Il faut prouver le passage : chasse, événement fantôme ou détecteur juste derrière la ligne. Pas de crucifix ni d'encens avant le test.",b:"Téléportation : un EMF aux pieds d'un joueur, loin de sa pièce, sans aucune interaction.",c:"Gallu enragée (elle écrase toujours le premier tas), Mimic."},
{id:2,fr:"Fantôme",en:"Phantom",t:"Photo pendant un événement fantôme : il disparaît aussitôt et n'apparaît pas sur la photo.",b:"Presque toujours invisible pendant les chasses.",c:"Obake (reste sur la photo)."},
{id:3,fr:"Poltergeist",en:"Poltergeist",t:"Fais un tas d'une dizaine d'objets dans sa pièce : il en projette plusieurs d'un coup.",b:"Lance des objets presque en continu pendant les chasses. En chasse, il tente de projeter un objet autour de lui toutes les 0,5 s.",c:"Les Jumeaux (deux interactions à deux endroits), Deildegast."},
{id:4,fr:"Banshee",en:"Banshee",t:"Micro parabolique : cri aigu caractéristique. À plusieurs, en chasse, elle ignore un joueur visible qui n'est pas sa cible.",b:"Toujours féminine. Ne change jamais de pièce, mais se promène loin pour suivre sa cible.",c:"Kormos (ignore tous les joueurs immobiles), Goryo."},
{id:5,fr:"Djinn",en:"Jinn",t:"Disjoncteur allumé : quand il te voit à plus de 3 m, il passe d'un coup à 2,5 m/s, puis ralentit près de toi. Disjoncteur coupé : vitesse normale.",b:"Ne coupe jamais le disjoncteur lui-même.",c:"Raiju : coupe le disjoncteur et garde ton électronique allumée."},
{id:6,fr:"Cauchemar",en:"Mare",t:"Allume une lumière : il l'éteint parfois une ou deux secondes après. Il ne rallume jamais une lumière.",b:"Quitte sa pièce, ou en change, quand la lumière y est allumée.",c:"Goryo (reste dans sa pièce même allumée)."},
{id:7,fr:"Revenant",en:"Revenant",t:"Caché, silencieux, électronique éteinte : pas très lents (1 m/s), puis 3 m/s d'un coup quand il te repère.",b:"Quand il te perd, il fonce jusqu'à ta dernière position, puis redevient lent.",c:"Thaye âgé, Hantu au chaud, Kormos, Deildegast."},
{id:8,fr:"Ombre",en:"Shade",t:"Reste dans la même pièce qu'elle : elle ne peut pas lancer de chasse et interagit très peu.",b:"Très discrète, plus active quand vous êtes loin. Au cercle d'invocation ou à la boîte à musique, elle n'apparaît qu'en ombre.",c:"Esprit (encens 180 s), Obambo calme, Goryo."},
{id:9,fr:"Démon",en:"Demon",t:"Encens, puis chrono : une chasse est possible dès 60 s (90 s pour les autres).",b:"Le crucifix agit sur lui 50 % plus loin. Peut rechasser 20 s après la fin d'une chasse (25 s pour les autres).",c:"Onryo (flammes), Thaye jeune, Gallu, Obambo agressif."},
{id:10,fr:"Yurei",en:"Yurei",t:"Encens dans sa pièce : il y reste bloqué 90 s. Mets du sel et des détecteurs aux sorties.",b:"Seul à fermer la porte d'entrée hors chasse ET hors événement fantôme.",c:"Goryo (peut sortir pendant les 90 s), Ombre."},
{id:11,fr:"Oni",en:"Oni",t:"Ne fait jamais l'événement brume.",b:"Très visible pendant les chasses, très actif près des joueurs. Visible environ 60 % du temps en chasse (environ 30 % pour les autres).",c:"Kormos (pas de brume non plus, mais jamais d'événement de poursuite)."},
{id:12,fr:"Yokai",en:"Yokai",t:"En chasse, il n'entend ta voix qu'à environ 2,5 m : caché à 4 ou 5 m, parle, il ne vient pas vers toi.",b:"Hors chasse, parler près de lui le rend plus agressif.",c:"Kormos (réagit aux pas, pas à la voix)."},
{id:13,fr:"Hantu",en:"Hantu",t:"Vitesse liée à la température : lent au chaud (environ 1,4 m/s), rapide au froid (environ 2,7 m/s). N'accélère pas en te voyant.",b:"Disjoncteur coupé : souffle froid visible pendant la chasse. Ne rallume jamais le disjoncteur.",c:"Revenant, Obambo calme."},
{id:14,fr:"Goryo",en:"Goryo",t:"Ne fait que de courtes promenades : des détecteurs à plus de 4 m de sa pièce ne sonnent jamais hors chasse ni événement. Ne change jamais de pièce.",b:"Pas de test à 100 % sans preuves : on le garde quand tout le reste est éliminé.",c:"Banshee, Yurei, Ombre."},
{id:15,fr:"Myling",en:"Myling",t:"Lampe allumée en chasse : elle clignote avant que tu entendes ses pas (audibles à environ 12 m au lieu de 20 m).",b:"Fait plus de bruits au micro parabolique.",c:"Raiju (accélère près de l'électronique), Revenant."},
{id:16,fr:"Onryo",en:"Onryo",t:"Bougie allumée et crucifix côte à côte : il souffle la bougie au lieu de chasser, le crucifix ne brûle pas. Après la 3e flamme soufflée, il chasse.",b:"Rallume la bougie à chaque fois pour suivre le compte.",c:"Démon (chasse souvent, la flamme ne l'arrête pas)."},
{id:17,fr:"Les Jumeaux",en:"The Twins",t:"Vitesse différente d'une chasse à l'autre (environ 1,5 ou 1,9 m/s), au hasard.",b:"Deux interactions presque simultanées à deux endroits.",c:"Obambo (sa vitesse suit un chrono), Poltergeist."},
{id:18,fr:"Raiju",en:"Raiju",t:"Électronique allumée posée sur son trajet : il passe à 2,5 m/s près d'elle, même sans te voir.",b:"Fait clignoter ton électronique de plus loin que les autres.",c:"Djinn (dépend du disjoncteur), Myling, Dayan."},
{id:19,fr:"Obake",en:"Obake",t:"Change d'apparence pendant une chasse.",b:"Empreintes à 6 doigts, qui disparaissent plus vite (si les UV sont actifs).",c:"Fantôme (disparaît sur la photo)."},
{id:20,fr:"Le Mimic",en:"The Mimic",t:"Fait toujours apparaître des orbes à la caméra, même à 0 preuve. Pose une caméra dans sa pièce.",b:"Copie les capacités des autres et change de modèle en cours de partie.",c:"Toutes les entités."},

mist:["Mist event"],chase:["Chase event","It follows you, doors close."],photo:["Vanishes when I photograph it during an event","No: it stayed visible on the photo."],shape:["Changes appearance during a hunt"],vis:["Very visible during hunts, rarely flickers"],invis:["Almost invisible during hunts"],
male:["The journal shows a male ghost"],scream:["High-pitched scream on the parabolic microphone"],target:["Always goes after the same player","No: it goes after several players."],

far:["Triggers a sensor more than 4 m from its room","Outside hunts and events."],room:["Changed favourite room"],same:["Started a hunt while I was in its room with it"],shy:["Nothing moves when I'm in its room","Stay several minutes with it in its room."],two:["Two interactions almost at once in two places"],

blind:["Blinded by incense much longer than usual","During hunts."],rage:["Faster after a crucifix, incense or salt"],crux:["Crucifix burned further than its normal range"],flame:["Blows out a flame instead of hunting","No: it hunted with a lit flame right next to it."],
cruxfl:["Crucifix burned while a flame was lit right next to it"],third:["Hunt right after the 3rd flame blown out"],lamp:["My flashlight flickers before I hear its steps during hunts","No: steps heard first."],elec:["Faster when passing near active electronics"],voice:["Didn't react to my voice at 4 or 5 m during a hunt"],

g:{0:["Incense, then timer: no hunt before 180 s (90 s for the others, 60 s for the Demon). Repeat 2 or 3 times.","No other sign: normal speed and behaviour.","Shade (presence test), Demon (60 s)."],
1:["Walks over salt without disturbing it. Prove the walk: hunt, ghost event or sensor right behind the line. No crucifix or incense before the test.","Teleport: EMF at a player's feet, far from its room, with no interaction.","Enraged Gallu (always crushes the first pile), Mimic."],
2:["Photo during a ghost event: it vanishes at once and doesn't show on the photo.","Almost always invisible during hunts.","Obake (stays on the photo)."],
3:["Make a pile of about ten objects in its room: it throws several at once.","Throws objects almost non-stop during hunts. During hunts it tries to throw an item near it every 0.5 s.","The Twins (two interactions in two places), Deildegast."],
4:["Parabolic microphone: distinctive high-pitched scream. In a group, during a hunt, it ignores a visible player who isn't its target.","Always female. Never changes room but roams far to follow its target.","Kormos (ignores all still players), Goryo."],
5:["Fuse box on: when it sees you more than 3 m away, it jumps to 2.5 m/s, then slows near you. Fuse box off: normal speed.","Never turns the fuse box off itself.","Raiju: turn the fuse box off and keep your electronics on."],
6:["Turn a light on: it sometimes turns it off one or two seconds later. It never turns a light on.","Leaves or changes room when the light there is on.","Goryo (stays in its room even when lit)."],
7:["Hidden, silent, electronics off: very slow steps (1 m/s), then 3 m/s in one go when it spots you.","When it loses you, it rushes to your last position, then slows down again.","Old Thaye, Hantu in warm rooms, Kormos, Deildegast."],
8:["Stay in the same room as it: it can't start a hunt and barely interacts.","Very shy, more active when you're far away. At the summoning circle or music box, it only appears as a shadow.","Spirit (incense 180 s), calm Obambo, Goryo."],
9:["Incense, then timer: a hunt is possible from 60 s (90 s for the others).","The crucifix works on it 50% further. Can hunt again 20 s after a hunt ends (25 s for others).","Onryo (flames), young Thaye, Gallu, aggressive Obambo."],
10:["Incense in its room: it stays stuck there for 90 s. Put salt and sensors at the exits.","Only ghost that closes the front door outside hunts AND outside ghost events.","Goryo (can leave during the 90 s), Shade."],
11:["Never does the mist event.","Very visible during hunts, very active near players. Visible about 60% of the time during hunts (about 30% for others).","Kormos (no mist either, but never a chase event)."],
12:["During hunts it only hears your voice at about 2.5 m: hidden 4 or 5 m away, talk, it doesn't come to you.","Outside hunts, talking near it makes it more aggressive.","Kormos (reacts to steps, not voice)."],
13:["Speed tied to temperature: slow in warm rooms (about 1.4 m/s), fast in cold ones (about 2.7 m/s). Doesn't speed up when it sees you.","Fuse box off: cold breath visible during hunts. Never turns the fuse box back on.","Revenant, calm Obambo."],
14:["Only does short roams: sensors more than 4 m from its room never trigger outside hunts or events. Never changes room.","No 100% test without evidence: keep it when everything else is ruled out.","Banshee, Yurei, Shade."],
15:["Flashlight on during a hunt: it flickers before you hear its steps (heard at about 12 m instead of 20 m).","Makes more sounds on the parabolic microphone.","Raiju (speeds up near electronics), Revenant."],
16:["Lit candle and crucifix side by side: it blows out the candle instead of hunting, the crucifix doesn't burn. After the 3rd flame blown out, it hunts.","Relight the candle each time to keep count.","Demon (hunts often, the flame doesn't stop it)."],
17:["Different speed from one hunt to the next (about 1.5 or 1.9 m/s), at random.","Two interactions almost at once in two places.","Obambo (its speed follows a timer), Poltergeist."],
18:["Active electronics placed on its path: it goes to 2.5 m/s near them, even without seeing you.","Makes your electronics flicker from further away than others.","Jinn (depends on the fuse box), Myling, Dayan."],
19:["Changes appearance during a hunt.","6-finger prints that fade faster (if UV is on).","Phantom (vanishes on photo)."],
20:["Always shows orbs on camera, even with 0 evidence. Put a camera in its room.","Copies other ghosts' abilities and changes model during the game.","All ghosts."],
21:["At 0%: fast without seeing you (about 2.3 m/s), then up to about 3.7 m/s when it sees you.","Incense during a hunt: blinded 7.5, 9 or 10.5 s instead of 5, 6 or 7 s (tiers I, II, III).","Dayan, young Thaye, Kormos, Deildegast, Aswang."],
22:["Very fast from afar (3 m/s), almost stopped right next to you (0.4 m/s).","Always knows where players are: hiding is useless.","Revenant (the opposite), Dayan."],
23:["Fast early in the game (about 2.75 m/s), then slows as it ages, down to 1 m/s. Never speeds up when it sees you.","It ages when you stay near it. The Ouija costs sanity: at 0%, risk of a cursed hunt.","Deildegast (objects), Obambo, Deogen."],
25:["Without crucifix, incense or salt: normal speed. After a protection: enraged and faster (about 1.96 m/s, up to 3.2 m/s). After an enraged hunt: weakened and slower (about 1.36 m/s).","Enraged, it can walk over salt without disturbing it.","Wraith, Obambo, Demon."],
26:["Within 10 m during a hunt: standing still, it drops to 1.2 m/s; if you move, it goes up to 2.25 m/s.","Always female.","Kormos, Deogen, Revenant."],
27:["Timer from the first opening of an exit door: calm from 0 to 1 min, aggressive from 1 to 3, then switches every 2 min. Calm about 1.45 m/s, aggressive about 1.96 m/s.","Hunts started while aggressive are 20% shorter.","The Twins, Gallu, Hantu."],
28:["Almost blind during hunts: standing still and visible more than 5 m away, it ignores you. It speeds up toward your footsteps (up to about 3.7 m/s).","Never does the mist event or a chase event.","Dayan, Yokai, Oni, Banshee."],
29:["Slow base speed (about 1.53 m/s). When it sees you, it speeds up faster than any other ghost (about 2.53 m/s in 9 s). If it reaches you in an official hiding spot, the hunt stops dead.","The next hunt starts with no grace period, straight to your hiding spot.","The Twins (slow speed), Moroi."],
30:["3 m/s at the start of each hunt, minus 0.1 m/s for each different house object moved before the hunt (minimum 0.4). Doesn't speed up when it sees you.","The count resets after each hunt or burned crucifix.","Revenant, Deogen, Thaye, Moroi."]}},

g:{0:["Räuchern, dann Timer: keine Jagd vor 180 s (90 s bei den anderen, 60 s beim Demon). 2- bis 3-mal wiederholen.","Kein anderes Zeichen: normales Tempo und Verhalten.","Shade (Anwesenheitstest), Demon (60 s)."],
1:["Geht über Salz, ohne es zu stören. Beweise den Gang: Jagd, Geisterereignis oder Melder direkt hinter der Linie. Vorher kein Kruzifix und kein Räucherwerk.","Teleport: EMF an den Füßen eines Spielers, weit weg von seinem Raum, ohne Interaktion.","Wütende Gallu (zertritt immer den ersten Haufen), Mimic."],
2:["Foto während eines Geisterereignisses: Er verschwindet sofort und ist nicht auf dem Foto.","Während der Jagd fast immer unsichtbar.","Obake (bleibt auf dem Foto)."],
3:["Mach einen Haufen aus etwa zehn Gegenständen in seinem Raum: Er wirft mehrere auf einmal.","Wirft während der Jagd fast ständig Gegenstände. Bei der Jagd versucht er alle 0,5 s, einen Gegenstand in seiner Nähe zu werfen.","The Twins (zwei Interaktionen an zwei Orten), Deildegast."],
4:["Parabolmikrofon: typischer hoher Schrei. In der Gruppe ignoriert sie bei der Jagd einen sichtbaren Spieler, der nicht ihr Ziel ist.","Immer weiblich. Wechselt nie den Raum, wandert aber weit zu ihrem Ziel.","Kormos (ignoriert alle stillstehenden Spieler), Goryo."],
5:["Sicherungskasten an: Sieht er dich auf mehr als 3 m, springt er auf 2,5 m/s und wird bei dir langsamer. Sicherungskasten aus: normales Tempo.","Schaltet den Sicherungskasten nie selbst aus.","Raiju: Sicherungskasten aus, Elektronik an lassen."],
6:["Mach ein Licht an: Er schaltet es manchmal ein bis zwei Sekunden später aus. Er schaltet nie ein Licht ein.","Verlässt oder wechselt den Raum, wenn dort Licht an ist.","Goryo (bleibt auch bei Licht in seinem Raum)."],
7:["Versteckt, leise, Elektronik aus: sehr langsame Schritte (1 m/s), dann schlagartig 3 m/s, wenn er dich entdeckt.","Verliert er dich, rast er zu deiner letzten Position und wird dann wieder langsam.","Alter Thaye, Hantu im Warmen, Kormos, Deildegast."],
8:["Bleib mit ihr im selben Raum: Sie kann keine Jagd starten und interagiert kaum.","Sehr scheu, aktiver, wenn ihr weit weg seid. Am Beschwörungskreis oder bei der Spieluhr erscheint sie nur als Schatten.","Spirit (Räucherwerk 180 s), ruhiger Obambo, Goryo."],
9:["Räuchern, dann Timer: Jagd schon ab 60 s möglich (90 s bei den anderen).","Das Kruzifix wirkt auf ihn 50 % weiter. Kann 20 s nach Jagdende erneut jagen (25 s bei anderen).","Onryo (Flammen), junger Thaye, Gallu, aggressiver Obambo."],
10:["Räuchern in seinem Raum: Er bleibt dort 90 s gefangen. Salz und Melder an die Ausgänge.","Einziger, der die Haustür außerhalb von Jagd UND Ereignis schließt.","Goryo (kann in den 90 s raus), Shade."],
11:["Macht nie das Nebel-Ereignis.","Während der Jagd sehr sichtbar, sehr aktiv bei Spielern. Bei der Jagd etwa 60 % der Zeit sichtbar (etwa 30 % bei anderen).","Kormos (auch kein Nebel, aber nie ein Verfolgungs-Ereignis)."],
12:["Hört deine Stimme bei der Jagd nur auf etwa 2,5 m: versteckt in 4 bis 5 m reden, er kommt nicht zu dir.","Außerhalb der Jagd macht ihn Reden in seiner Nähe aggressiver.","Kormos (reagiert auf Schritte, nicht auf Stimme)."],
13:["Tempo hängt von der Temperatur ab: langsam im Warmen (etwa 1,4 m/s), schnell im Kalten (etwa 2,7 m/s). Wird nicht schneller, wenn er dich sieht.","Sicherungskasten aus: kalter Atem während der Jagd sichtbar. Schaltet den Sicherungskasten nie wieder ein.","Revenant, ruhiger Obambo."],
14:["Macht nur kurze Streifzüge: Melder mehr als 4 m von seinem Raum lösen außerhalb von Jagd und Ereignis nie aus. Wechselt nie den Raum.","Ohne Beweise kein 100-%-Test: Er bleibt übrig, wenn alles andere ausgeschlossen ist.","Banshee, Yurei, Shade."],
15:["Taschenlampe bei der Jagd an: Sie flackert, bevor du seine Schritte hörst (hörbar auf etwa 12 m statt 20 m).","Macht mehr Geräusche im Parabolmikrofon.","Raiju (schneller bei Elektronik), Revenant."],
16:["Brennende Kerze und Kruzifix nebeneinander: Er bläst die Kerze aus, statt zu jagen, das Kruzifix brennt nicht. Nach der 3. ausgeblasenen Flamme jagt er.","Kerze jedes Mal neu anzünden, um mitzuzählen.","Demon (jagt oft, die Flamme stoppt ihn nicht)."],
17:["Anderes Tempo von Jagd zu Jagd (etwa 1,5 oder 1,9 m/s), zufällig.","Zwei Interaktionen fast gleichzeitig an zwei Orten.","Obambo (sein Tempo folgt einem Timer), Poltergeist."],
18:["Eingeschaltete Elektronik auf seinem Weg: Er wird dort 2,5 m/s schnell, auch ohne dich zu sehen.","Lässt deine Elektronik aus größerer Entfernung flackern.","Jinn (hängt vom Sicherungskasten ab), Myling, Dayan."],
19:["Ändert während der Jagd sein Aussehen.","Abdrücke mit 6 Fingern, die schneller verblassen (wenn UV aktiv).","Phantom (verschwindet auf dem Foto)."],
20:["Zeigt immer Orbs auf der Kamera, auch bei 0 Beweisen. Stell eine Kamera in seinen Raum.","Kopiert die Fähigkeiten anderer Geister und wechselt im Spiel das Modell.","Alle Geister."],
21:["Bei 0 %: schnell ohne dich zu sehen (etwa 2,3 m/s), dann bis etwa 3,7 m/s, wenn er dich sieht.","Räucherwerk bei der Jagd: 7,5, 9 oder 10,5 s geblendet statt 5, 6 oder 7 s (Stufe I, II, III).","Dayan, junger Thaye, Kormos, Deildegast, Aswang."],
22:["Von weitem sehr schnell (3 m/s), direkt bei dir fast stehend (0,4 m/s).","Weiß immer, wo die Spieler sind: Verstecken bringt nichts.","Revenant (das Gegenteil), Dayan."],
23:["Früh im Spiel schnell (etwa 2,75 m/s), wird dann mit dem Alter langsamer, bis 1 m/s. Wird nie schneller, wenn er dich sieht.","Er altert, wenn ihr in seiner Nähe bleibt. Das Ouija kostet Verstand: bei 0 % droht eine verfluchte Jagd.","Deildegast (Gegenstände), Obambo, Deogen."],
25:["Ohne Kruzifix, Räucherwerk oder Salz: normales Tempo. Nach einem Schutz: wütend und schneller (etwa 1,96 m/s, bis 3,2 m/s). Nach einer wütenden Jagd: geschwächt und langsamer (etwa 1,36 m/s).","Wütend kann sie über Salz gehen, ohne es zu stören.","Wraith, Obambo, Demon."],
26:["Innerhalb von 10 m bei der Jagd: Stehst du still, fällt sie auf 1,2 m/s; bewegst du dich, steigt sie auf 2,25 m/s.","Immer weiblich.","Kormos, Deogen, Revenant."],
27:["Timer ab dem ersten Öffnen einer Ausgangstür: ruhig von 0 bis 1 Min., aggressiv von 1 bis 3, dann Wechsel alle 2 Min. Ruhig etwa 1,45 m/s, aggressiv etwa 1,96 m/s.","Im aggressiven Zustand gestartete Jagden sind 20 % kürzer.","The Twins, Gallu, Hantu."],
28:["Bei der Jagd fast blind: Stehst du still und sichtbar auf mehr als 5 m, ignoriert er dich. Wird zu deinen Schritten hin schneller (bis etwa 3,7 m/s).","Macht nie das Nebel- oder Verfolgungs-Ereignis.","Dayan, Yokai, Oni, Banshee."],
29:["Langsames Grundtempo (etwa 1,53 m/s). Sieht er dich, wird er schneller als jeder andere Geist (etwa 2,53 m/s in 9 s). Erreicht er dich in einem offiziellen Versteck, endet die Jagd sofort.","Die nächste Jagd beginnt ohne Schonfrist, direkt zu deinem Versteck.","The Twins (langsames Tempo), Moroi."],
30:["3 m/s zu Beginn jeder Jagd, minus 0,1 m/s für jeden verschiedenen Hausgegenstand, der vor der Jagd bewegt wurde (mindestens 0,4). Wird nicht schneller, wenn er dich sieht.","Der Zähler wird nach jeder Jagd oder jedem verbrannten Kruzifix zurückgesetzt.","Revenant, Deogen, Thaye, Moroi."]}},

g:{0:["Incenso, poi cronometro: nessuna caccia prima di 180 s (90 s per le altre, 60 s per il Demon). Ripeti 2 o 3 volte.","Nessun altro segno: velocità e comportamento normali.","Shade (test di presenza), Demon (60 s)."],
1:["Passa sul sale senza toccarlo. Prova il passaggio: caccia, evento o sensore subito dietro la linea. Niente crocifisso né incenso prima del test.","Teletrasporto: EMF ai piedi di un giocatore, lontano dalla sua stanza, senza interazione.","Gallu infuriata (calpesta sempre il primo mucchio), Mimic."],
2:["Foto durante un evento: sparisce subito e non appare nella foto.","Quasi sempre invisibile durante la caccia.","Obake (resta nella foto)."],
3:["Fai un mucchio di una decina di oggetti nella sua stanza: ne lancia diversi in una volta.","Lancia oggetti quasi senza sosta durante la caccia. In caccia prova a lanciare un oggetto vicino a sé ogni 0,5 s.","The Twins (due interazioni in due posti), Deildegast."],
4:["Microfono parabolico: urlo acuto tipico. In gruppo, durante la caccia, ignora un giocatore visibile che non è il suo bersaglio.","Sempre femminile. Non cambia mai stanza ma va lontano per seguire il bersaglio.","Kormos (ignora tutti i giocatori fermi), Goryo."],
5:["Quadro acceso: se ti vede a più di 3 m, scatta a 2,5 m/s, poi rallenta vicino a te. Quadro spento: velocità normale.","Non spegne mai il quadro da solo.","Raiju: spegni il quadro e tieni accesa l'elettronica."],
6:["Accendi una luce: a volte la spegne uno o due secondi dopo. Non accende mai una luce.","Lascia o cambia stanza quando la luce è accesa.","Goryo (resta nella sua stanza anche con la luce)."],
7:["Nascosto, in silenzio, elettronica spenta: passi lentissimi (1 m/s), poi 3 m/s di colpo quando ti individua.","Quando ti perde, corre alla tua ultima posizione, poi torna lento.","Thaye vecchio, Hantu al caldo, Kormos, Deildegast."],
8:["Resta nella sua stessa stanza: non può iniziare una caccia e interagisce pochissimo.","Molto timida, più attiva quando siete lontani. Al cerchio di evocazione o al carillon appare solo come ombra.","Spirit (incenso 180 s), Obambo calmo, Goryo."],
9:["Incenso, poi cronometro: caccia possibile già da 60 s (90 s per le altre).","Il crocifisso agisce su di lui il 50% più lontano. Può cacciare di nuovo 20 s dopo la fine di una caccia (25 s per le altre).","Onryo (fiamme), Thaye giovane, Gallu, Obambo aggressivo."],
10:["Incenso nella sua stanza: resta bloccato lì 90 s. Metti sale e sensori alle uscite.","Unico a chiudere la porta d'ingresso fuori caccia E fuori evento.","Goryo (può uscire nei 90 s), Shade."],
11:["Non fa mai l'evento nebbia.","Molto visibile durante la caccia, molto attivo vicino ai giocatori. Visibile circa il 60% del tempo in caccia (circa il 30% per le altre).","Kormos (niente nebbia neanche lui, ma mai un inseguimento)."],
12:["In caccia sente la tua voce solo a circa 2,5 m: nascosto a 4 o 5 m, parla, non viene verso di te.","Fuori caccia, parlargli vicino lo rende più aggressivo.","Kormos (reagisce ai passi, non alla voce)."],
13:["Velocità legata alla temperatura: lento al caldo (circa 1,4 m/s), veloce al freddo (circa 2,7 m/s). Non accelera quando ti vede.","Quadro spento: respiro freddo visibile in caccia. Non riaccende mai il quadro elettrico.","Revenant, Obambo calmo."],
14:["Fa solo brevi giri: i sensori a più di 4 m dalla sua stanza non scattano mai fuori caccia o evento. Non cambia mai stanza.","Nessun test al 100% senza prove: tienilo quando tutto il resto è escluso.","Banshee, Yurei, Shade."],
15:["Torcia accesa in caccia: lampeggia prima che tu senta i suoi passi (udibili a circa 12 m invece di 20 m).","Fa più rumori al microfono parabolico.","Raiju (accelera vicino all'elettronica), Revenant."],
16:["Candela accesa e crocifisso affiancati: spegne la candela invece di cacciare, il crocifisso non brucia. Dopo la 3ª fiamma spenta, caccia.","Riaccendi la candela ogni volta per tenere il conto.","Demon (caccia spesso, la fiamma non lo ferma)."],
17:["Velocità diversa da una caccia all'altra (circa 1,5 o 1,9 m/s), a caso.","Due interazioni quasi insieme in due posti.","Obambo (velocità a cronometro), Poltergeist."],
18:["Elettronica accesa sul suo percorso: lì va a 2,5 m/s, anche senza vederti.","Fa lampeggiare l'elettronica da più lontano delle altre.","Jinn (dipende dal quadro), Myling, Dayan."],
19:["Cambia aspetto durante la caccia.","Impronte a 6 dita che svaniscono prima (se l'UV è attivo).","Phantom (sparisce in foto)."],
20:["Mostra sempre orbi in videocamera, anche a 0 prove. Metti una videocamera nella sua stanza.","Copia le abilità delle altre entità e cambia modello durante la partita.","Tutte le entità."],
21:["A 0%: veloce senza vederti (circa 2,3 m/s), poi fino a circa 3,7 m/s quando ti vede.","Incenso in caccia: accecato 7,5, 9 o 10,5 s invece di 5, 6 o 7 s (livelli I, II, III).","Dayan, Thaye giovane, Kormos, Deildegast, Aswang."],
22:["Velocissimo da lontano (3 m/s), quasi fermo vicino a te (0,4 m/s).","Sa sempre dove sono i giocatori: nascondersi non serve.","Revenant (l'opposto), Dayan."],
23:["Veloce a inizio partita (circa 2,75 m/s), poi rallenta invecchiando fino a 1 m/s. Non accelera mai quando ti vede.","Invecchia quando restate vicino a lui. La Ouija costa sanità: a 0% rischi una caccia maledetta.","Deildegast (oggetti), Obambo, Deogen."],
25:["Senza crocifisso, incenso o sale: velocità normale. Dopo una protezione: infuriata e più veloce (circa 1,96 m/s, fino a 3,2 m/s). Dopo una caccia infuriata: indebolita e più lenta (circa 1,36 m/s).","Infuriata, può passare sul sale senza toccarlo.","Wraith, Obambo, Demon."],
26:["Entro 10 m in caccia: se resti fermo scende a 1,2 m/s; se ti muovi sale a 2,25 m/s.","Sempre femminile.","Kormos, Deogen, Revenant."],
27:["Cronometro dalla prima apertura di una porta d'uscita: calmo da 0 a 1 min, aggressivo da 1 a 3, poi cambia ogni 2 min. Calmo circa 1,45 m/s, aggressivo circa 1,96 m/s.","Le cacce iniziate da aggressivo durano il 20% in meno.","The Twins, Gallu, Hantu."],
28:["Quasi cieco in caccia: fermo e visibile a più di 5 m, ti ignora. Accelera verso i tuoi passi (fino a circa 3,7 m/s).","Non fa mai l'evento nebbia né un inseguimento.","Dayan, Yokai, Oni, Banshee."],
29:["Velocità di base lenta (circa 1,53 m/s). Quando ti vede accelera più di ogni altra entità (circa 2,53 m/s in 9 s). Se ti raggiunge in un nascondiglio ufficiale, la caccia si ferma di colpo.","La caccia successiva parte senza periodo di grazia, dritta al tuo nascondiglio.","The Twins (velocità lenta), Moroi."],
30:["3 m/s all'inizio di ogni caccia, meno 0,1 m/s per ogni oggetto diverso della casa spostato prima della caccia (minimo 0,4). Non accelera quando ti vede.","Il conteggio si azzera dopo ogni caccia o crocifisso bruciato.","Revenant, Deogen, Thaye, Moroi."]}},

g:{0:["Tămâie, apoi cronometru: nicio vânătoare înainte de 180 s (90 s pentru celelalte, 60 s pentru Demon). Repetă de 2–3 ori.","Niciun alt semn: viteză și comportament normale.","Shade (testul prezenței), Demon (60 s)."],
1:["Trece peste sare fără s-o deranjeze. Dovedește trecerea: vânătoare, eveniment sau senzor chiar după linie. Fără crucifix sau tămâie înainte de test.","Teleportare: EMF la picioarele unui jucător, departe de camera lui, fără interacțiune.","Gallu înfuriată (calcă mereu prima grămadă), Mimic."],
2:["Poză în timpul unui eveniment: dispare imediat și nu apare în poză.","Aproape mereu invizibilă la vânătoare.","Obake (rămâne în poză)."],
3:["Fă o grămadă de vreo zece obiecte în camera lui: aruncă mai multe deodată.","Aruncă obiecte aproape fără oprire la vânătoare. La vânătoare încearcă să arunce un obiect din jur la fiecare 0,5 s.","The Twins (două interacțiuni în două locuri), Deildegast."],
4:["Microfon parabolic: țipăt ascuțit tipic. În grup, la vânătoare, ignoră un jucător vizibil care nu e ținta ei.","Mereu feminină. Nu schimbă niciodată camera, dar merge departe după țintă.","Kormos (ignoră toți jucătorii nemișcați), Goryo."],
5:["Tablou pornit: când te vede la peste 3 m, sare la 2,5 m/s, apoi încetinește lângă tine. Tablou oprit: viteză normală.","Nu oprește niciodată singur tabloul.","Raiju: oprește tabloul și lasă electronicele pornite."],
6:["Aprinde o lumină: uneori o stinge la o secundă-două după. Nu aprinde niciodată o lumină.","Pleacă sau schimbă camera când lumina e aprinsă acolo.","Goryo (rămâne în cameră și cu lumina aprinsă)."],
7:["Ascuns, în liniște, electronice oprite: pași foarte lenți (1 m/s), apoi brusc 3 m/s când te reperează.","Când te pierde, fuge la ultima ta poziție, apoi încetinește din nou.","Thaye bătrân, Hantu la cald, Kormos, Deildegast."],
8:["Stai în aceeași cameră cu ea: nu poate porni o vânătoare și interacționează foarte puțin.","Foarte timidă, mai activă când sunteți departe. La cercul de invocare sau la cutia muzicală apare doar ca umbră.","Spirit (tămâie 180 s), Obambo calm, Goryo."],
9:["Tămâie, apoi cronometru: vânătoarea e posibilă de la 60 s (90 s pentru celelalte).","Crucifixul acționează asupra lui cu 50% mai departe. Poate vâna din nou la 20 s după o vânătoare (25 s la celelalte).","Onryo (flăcări), Thaye tânăr, Gallu, Obambo agresiv."],
10:["Tămâie în camera lui: rămâne blocat acolo 90 s. Pune sare și senzori la ieșiri.","Singurul care închide ușa de la intrare în afara vânătorii ȘI a evenimentelor.","Goryo (poate ieși în cele 90 s), Shade."],
11:["Nu face niciodată evenimentul ceață.","Foarte vizibil la vânătoare, foarte activ lângă jucători. Vizibil cam 60% din timp la vânătoare (cam 30% la celelalte).","Kormos (nici el nu face ceață, dar niciodată urmărire)."],
12:["La vânătoare îți aude vocea doar de la circa 2,5 m: ascuns la 4–5 m, vorbește, nu vine spre tine.","În afara vânătorii, vorbitul lângă el îl face mai agresiv.","Kormos (reacționează la pași, nu la voce)."],
13:["Viteza depinde de temperatură: lent la cald (circa 1,4 m/s), rapid la rece (circa 2,7 m/s). Nu accelerează când te vede.","Tablou oprit: respirație rece vizibilă la vânătoare. Nu repornește niciodată tabloul electric.","Revenant, Obambo calm."],
14:["Face doar plimbări scurte: senzorii la peste 4 m de camera lui nu se declanșează niciodată în afara vânătorii sau a evenimentelor. Nu schimbă niciodată camera.","Fără dovezi nu există test 100%: păstrează-l când tot restul e exclus.","Banshee, Yurei, Shade."],
15:["Lanterna pornită la vânătoare: clipește înainte să-i auzi pașii (auziți la circa 12 m în loc de 20 m).","Face mai multe sunete la microfonul parabolic.","Raiju (accelerează lângă electronice), Revenant."],
16:["Lumânare aprinsă și crucifix alăturate: suflă lumânarea în loc să vâneze, crucifixul nu arde. După a 3-a flacără stinsă, vânează.","Reaprinde lumânarea de fiecare dată ca să ții socoteala.","Demon (vânează des, flacăra nu-l oprește)."],
17:["Viteză diferită de la o vânătoare la alta (circa 1,5 sau 1,9 m/s), la întâmplare.","Două interacțiuni aproape simultan în două locuri.","Obambo (viteza lui urmează un cronometru), Poltergeist."],
18:["Electronice pornite puse pe traseul lui: acolo merge cu 2,5 m/s, chiar fără să te vadă.","Face electronicele să clipească de mai departe decât celelalte.","Jinn (depinde de tablou), Myling, Dayan."],
19:["Își schimbă aspectul la vânătoare.","Amprente cu 6 degete care dispar mai repede (dacă UV e activ).","Phantom (dispare în poză)."],
20:["Arată mereu orbi pe cameră, chiar la 0 dovezi. Pune o cameră în camera lui.","Copiază abilitățile altor entități și își schimbă modelul în timpul jocului.","Toate entitățile."],
21:["La 0%: rapid fără să te vadă (circa 2,3 m/s), apoi până la circa 3,7 m/s când te vede.","Tămâie la vânătoare: orbit 7,5, 9 sau 10,5 s în loc de 5, 6 sau 7 s (nivel I, II, III).","Dayan, Thaye tânăr, Kormos, Deildegast, Aswang."],
22:["Foarte rapid de departe (3 m/s), aproape oprit lângă tine (0,4 m/s).","Știe mereu unde sunt jucătorii: ascunsul nu ajută.","Revenant (opusul), Dayan."],
23:["Rapid la începutul jocului (circa 2,75 m/s), apoi încetinește îmbătrânind, până la 1 m/s. Nu accelerează niciodată când te vede.","Îmbătrânește când stați lângă el. Ouija costă sănătate: la 0% riști o vânătoare blestemată.","Deildegast (obiecte), Obambo, Deogen."],
25:["Fără crucifix, tămâie sau sare: viteză normală. După o protecție: înfuriată și mai rapidă (circa 1,96 m/s, până la 3,2 m/s). După o vânătoare înfuriată: slăbită și mai lentă (circa 1,36 m/s).","Înfuriată, poate trece peste sare fără s-o deranjeze.","Wraith, Obambo, Demon."],
26:["La mai puțin de 10 m la vânătoare: dacă stai pe loc coboară la 1,2 m/s; dacă te miști urcă la 2,25 m/s.","Mereu feminină.","Kormos, Deogen, Revenant."],
27:["Cronometru de la prima deschidere a unei uși de ieșire: calm de la 0 la 1 min, agresiv de la 1 la 3, apoi schimbă la fiecare 2 min. Calm circa 1,45 m/s, agresiv circa 1,96 m/s.","Vânătorile pornite în starea agresivă sunt cu 20% mai scurte.","The Twins, Gallu, Hantu."],
28:["Aproape orb la vânătoare: nemișcat și vizibil la peste 5 m, te ignoră. Accelerează spre pașii tăi (până la circa 3,7 m/s).","Nu face niciodată evenimentul ceață sau urmărire.","Dayan, Yokai, Oni, Banshee."],
29:["Viteză de bază lentă (circa 1,53 m/s). Când te vede, accelerează mai repede decât orice altă entitate (circa 2,53 m/s în 9 s). Dacă te ajunge într-o ascunzătoare oficială, vânătoarea se oprește brusc.","Următoarea vânătoare pornește fără perioadă de grație, direct la ascunzătoarea ta.","The Twins (viteză lentă), Moroi."],
30:["3 m/s la începutul fiecărei vânători, minus 0,1 m/s pentru fiecare obiect diferit din casă mutat înainte de vânătoare (minim 0,4). Nu accelerează când te vede.","Numărătoarea se resetează după fiecare vânătoare sau crucifix ars.","Revenant, Deogen, Thaye, Moroi."]}}

g:{0:["Incienso y cronómetro: ninguna caza antes de 180 s (90 s para los demás, 60 s para el Demon). Repite 2 o 3 veces.","Ninguna otra señal: velocidad y comportamiento normales.","Shade (prueba de presencia), Demon (60 s)."],
1:["Pasa por la sal sin tocarla. Comprueba el paso: caza, evento o sensor justo detrás de la línea. Sin crucifijo ni incienso antes de la prueba.","Teletransporte: EMF a los pies de un jugador, lejos de su habitación, sin interacción.","Gallu enfurecido (siempre pisa el primer montón), Mimic."],
2:["Foto durante un evento: desaparece al instante y no sale en la foto.","Casi siempre invisible durante la caza.","Obake (sale en la foto)."],
3:["Haz un montón de unos diez objetos en su habitación: lanza varios a la vez.","Lanza objetos casi sin parar durante la caza. En caza intenta lanzar un objeto cercano cada 0,5 s.","The Twins (dos interacciones en dos sitios), Deildegast."],
4:["Micrófono parabólico: grito agudo característico. En grupo, durante la caza, ignora a un jugador visible que no es su objetivo.","Siempre femenina. Nunca cambia de habitación, pero va lejos para seguir a su objetivo.","Kormos (ignora a todos los jugadores quietos), Goryo."],
5:["Fusibles encendidos: si te ve a más de 3 m, salta a 2,5 m/s y frena cerca de ti. Fusibles apagados: velocidad normal.","Nunca apaga la caja de fusibles él mismo.","Raiju: apaga los fusibles y deja tu electrónica encendida."],
6:["Enciende una luz: a veces la apaga uno o dos segundos después. Nunca enciende una luz.","Sale o cambia de habitación cuando su luz está encendida.","Goryo (se queda en su habitación aunque haya luz)."],
7:["Escondido, en silencio, electrónica apagada: pasos muy lentos (1 m/s), luego 3 m/s de golpe al detectarte.","Cuando te pierde, corre a tu última posición y vuelve a ir lento.","Thaye viejo, Hantu en zona cálida, Kormos, Deildegast."],
8:["Quédate en su misma habitación: no puede empezar una caza y casi no interactúa.","Muy tímida, más activa cuando estáis lejos. En el círculo de invocación o con la caja de música solo aparece como sombra.","Spirit (incienso 180 s), Obambo calmado, Goryo."],
9:["Incienso y cronómetro: una caza es posible desde 60 s (90 s para los demás).","El crucifijo le afecta un 50 % más lejos. Puede volver a cazar 20 s después de una caza (25 s para los demás).","Onryo (llamas), Thaye joven, Gallu, Obambo agresivo."],
10:["Incienso en su habitación: se queda bloqueado allí 90 s. Pon sal y sensores en las salidas.","Único que cierra la puerta de entrada fuera de caza Y de evento.","Goryo (puede salir en esos 90 s), Shade."],
11:["Nunca hace el evento de niebla.","Muy visible en caza, muy activo cerca de los jugadores. Visible alrededor del 60 % del tiempo en caza (unos 30 % los demás).","Kormos (tampoco hace niebla, pero nunca persecución)."],
12:["En caza solo oye tu voz a unos 2,5 m: escondido a 4–5 m, habla; no viene hacia ti.","Fuera de caza, hablar cerca lo vuelve más agresivo.","Kormos (reacciona a los pasos, no a la voz)."],
13:["Velocidad según la temperatura: lento en lo cálido (unos 1,4 m/s), rápido en lo frío (unos 2,7 m/s). No acelera al verte.","Fusibles apagados: aliento frío visible en caza. Nunca vuelve a encender los fusibles.","Revenant, Obambo calmado."],
14:["Solo hace paseos cortos: los sensores a más de 4 m de su habitación nunca se activan fuera de caza o evento. Nunca cambia de habitación.","Sin pruebas no hay test al 100 %: se queda cuando todo lo demás está descartado.","Banshee, Yurei, Shade."],
15:["Linterna encendida en caza: parpadea antes de que oigas sus pasos (se oyen a unos 12 m en vez de 20 m).","Hace más ruidos en el micrófono parabólico.","Raiju (acelera cerca de la electrónica), Revenant."],
16:["Vela encendida y crucifijo juntos: apaga la vela en lugar de cazar y el crucifijo no se quema. Tras la 3.ª llama apagada, caza.","Vuelve a encender la vela cada vez para llevar la cuenta.","Demon (caza a menudo, la llama no lo detiene)."],
17:["Velocidad distinta de una caza a otra (unos 1,5 o 1,9 m/s), al azar.","Dos interacciones casi a la vez en dos sitios.","Obambo (su velocidad sigue un cronómetro), Poltergeist."],
18:["Electrónica encendida en su camino: allí va a 2,5 m/s, incluso sin verte.","Hace parpadear la electrónica desde más lejos que los demás.","Jinn (depende de los fusibles), Myling, Dayan."],
19:["Cambia de aspecto durante la caza.","Huellas de 6 dedos que desaparecen antes (si hay UV).","Phantom (desaparece en la foto)."],
20:["Siempre muestra orbes en cámara, incluso con 0 pruebas. Pon una cámara en su habitación.","Copia las habilidades de otros fantasmas y cambia de modelo durante la partida.","Todos los fantasmas."],
21:["Al 0 %: rápido sin verte (unos 2,3 m/s), luego hasta unos 3,7 m/s cuando te ve.","Incienso en caza: cegado 7,5, 9 o 10,5 s en vez de 5, 6 o 7 s (niveles I, II, III).","Dayan, Thaye joven, Kormos, Deildegast, Aswang."],
22:["Muy rápido de lejos (3 m/s), casi parado justo a tu lado (0,4 m/s).","Siempre sabe dónde están los jugadores: esconderse no sirve.","Revenant (lo contrario), Dayan."],
23:["Rápido al principio (unos 2,75 m/s), luego más lento al envejecer, hasta 1 m/s. Nunca acelera al verte.","Envejece cuando os quedáis cerca. La Ouija cuesta cordura: al 0 %, riesgo de caza maldita.","Deildegast (objetos), Obambo, Deogen."],
25:["Sin crucifijo, incienso ni sal: velocidad normal. Tras una protección: enfurecido y más rápido (unos 1,96 m/s, hasta 3,2 m/s). Tras una caza enfurecida: debilitado y más lento (unos 1,36 m/s).","Enfurecido, puede pasar por la sal sin tocarla.","Wraith, Obambo, Demon."],
26:["A menos de 10 m en caza: si te quedas quieto baja a 1,2 m/s; si te mueves sube a 2,25 m/s.","Siempre femenina.","Kormos, Deogen, Revenant."],
27:["Cronómetro desde la primera apertura de una puerta de salida: calmado de 0 a 1 min, agresivo de 1 a 3, luego cambia cada 2 min. Calmado unos 1,45 m/s, agresivo unos 1,96 m/s.","Las cazas iniciadas en estado agresivo duran un 20 % menos.","The Twins, Gallu, Hantu."],
28:["Casi ciego en caza: quieto y visible a más de 5 m, te ignora. Acelera hacia tus pasos (hasta unos 3,7 m/s).","Nunca hace el evento de niebla ni de persecución.","Dayan, Yokai, Oni, Banshee."],
29:["Velocidad base lenta (unos 1,53 m/s). Al verte acelera más rápido que cualquier otro (unos 2,53 m/s en 9 s). Si te alcanza en un escondite oficial, la caza se detiene en seco.","La siguiente caza empieza sin periodo de gracia, directo a tu escondite.","The Twins (velocidad lenta), Moroi."],
30:["3 m/s al inicio de cada caza, menos 0,1 m/s por cada objeto distinto de la casa movido antes (mínimo 0,4). No acelera al verte.","El contador se reinicia tras cada caza o crucifijo quemado.","Revenant, Deogen, Thaye, Moroi."]}};

g:{0:["Incenso e cronômetro: nenhuma caçada antes de 180 s (90 s para os outros, 60 s para o Demon). Repita 2 ou 3 vezes.","Nenhum outro sinal: velocidade e comportamento normais.","Shade (teste de presença), Demon (60 s)."],
1:["Passa pelo sal sem mexer nele. Comprove a passagem: caçada, evento ou sensor logo atrás da linha. Sem crucifixo nem incenso antes do teste.","Teleporte: EMF aos pés de um jogador, longe do cômodo, sem interação.","Gallu enfurecido (sempre pisa o primeiro monte), Mimic."],
2:["Foto durante um evento: some na hora e não aparece na foto.","Quase sempre invisível na caçada.","Obake (aparece na foto)."],
3:["Faça um monte de uns dez objetos no cômodo dele: arremessa vários de uma vez.","Arremessa objetos quase sem parar na caçada. Na caçada tenta arremessar um objeto próximo a cada 0,5 s.","The Twins (duas interações em dois lugares), Deildegast."],
4:["Microfone parabólico: grito agudo típico. Em grupo, na caçada, ignora um jogador visível que não é o alvo dela.","Sempre feminina. Nunca muda de cômodo, mas vai longe para seguir o alvo.","Kormos (ignora todos os jogadores parados), Goryo."],
5:["Caixa de força ligada: se te vê a mais de 3 m, salta para 2,5 m/s e desacelera perto de você. Desligada: velocidade normal.","Nunca desliga a caixa de força sozinho.","Raiju: desligue a caixa e deixe seus eletrônicos ligados."],
6:["Acenda uma luz: às vezes ele apaga um ou dois segundos depois. Nunca acende uma luz.","Sai ou troca de cômodo quando a luz dele está acesa.","Goryo (fica no cômodo mesmo com luz)."],
7:["Escondido, em silêncio, eletrônicos desligados: passos muito lentos (1 m/s), depois 3 m/s de uma vez ao te detectar.","Quando te perde, corre até sua última posição e volta a ficar lento.","Thaye velho, Hantu no quente, Kormos, Deildegast."],
8:["Fique no mesmo cômodo que ela: não pode começar uma caçada e quase não interage.","Muito tímida, mais ativa quando vocês estão longe. No círculo de invocação ou na caixa de música só aparece como sombra.","Spirit (incenso 180 s), Obambo calmo, Goryo."],
9:["Incenso e cronômetro: caçada possível a partir de 60 s (90 s para os outros).","O crucifixo age nele 50% mais longe. Pode caçar de novo 20 s depois de uma caçada (25 s para os outros).","Onryo (chamas), Thaye jovem, Gallu, Obambo agressivo."],
10:["Incenso no cômodo dele: fica preso lá 90 s. Coloque sal e sensores nas saídas.","Único que fecha a porta de entrada fora de caçada E de evento.","Goryo (pode sair nos 90 s), Shade."],
11:["Nunca faz o evento de névoa.","Muito visível na caçada, muito ativo perto dos jogadores. Visível cerca de 60% do tempo na caçada (uns 30% os outros).","Kormos (também sem névoa, mas nunca perseguição)."],
12:["Na caçada só ouve sua voz a cerca de 2,5 m: escondido a 4–5 m, fale; ele não vem até você.","Fora da caçada, falar perto dele o deixa mais agressivo.","Kormos (reage a passos, não à voz)."],
13:["Velocidade ligada à temperatura: lento no quente (cerca de 1,4 m/s), rápido no frio (cerca de 2,7 m/s). Não acelera ao te ver.","Caixa de força desligada: hálito frio visível na caçada. Nunca religa a caixa de força.","Revenant, Obambo calmo."],
14:["Só faz passeios curtos: sensores a mais de 4 m do cômodo nunca disparam fora de caçada ou evento. Nunca muda de cômodo.","Sem evidências não há teste 100%: fica quando todo o resto foi descartado.","Banshee, Yurei, Shade."],
15:["Lanterna ligada na caçada: pisca antes de você ouvir os passos (ouvidos a cerca de 12 m em vez de 20 m).","Faz mais sons no microfone parabólico.","Raiju (acelera perto de eletrônicos), Revenant."],
16:["Vela acesa e crucifixo lado a lado: apaga a vela em vez de caçar, o crucifixo não queima. Depois da 3ª chama apagada, caça.","Reacenda a vela a cada vez para contar.","Demon (caça muito, a chama não o para)."],
17:["Velocidade diferente de uma caçada para outra (cerca de 1,5 ou 1,9 m/s), ao acaso.","Duas interações quase ao mesmo tempo em dois lugares.","Obambo (velocidade segue um cronômetro), Poltergeist."],
18:["Eletrônicos ligados no caminho dele: ali vai a 2,5 m/s, mesmo sem te ver.","Faz os eletrônicos piscarem de mais longe que os outros.","Jinn (depende da caixa de força), Myling, Dayan."],
19:["Muda de aparência durante a caçada.","Digitais de 6 dedos que somem mais rápido (se houver UV).","Phantom (some na foto)."],
20:["Sempre mostra orbes na câmera, mesmo com 0 evidências. Coloque uma câmera no cômodo dele.","Copia habilidades de outros fantasmas e muda de modelo durante a partida.","Todos os fantasmas."],
21:["Em 0%: rápido sem te ver (cerca de 2,3 m/s), depois até cerca de 3,7 m/s quando te vê.","Incenso na caçada: cego por 7,5, 9 ou 10,5 s em vez de 5, 6 ou 7 s (níveis I, II, III).","Dayan, Thaye jovem, Kormos, Deildegast, Aswang."],
22:["Muito rápido de longe (3 m/s), quase parado bem perto de você (0,4 m/s).","Sempre sabe onde os jogadores estão: se esconder não adianta.","Revenant (o oposto), Dayan."],
23:["Rápido no começo (cerca de 2,75 m/s), depois mais lento ao envelhecer, até 1 m/s. Nunca acelera ao te ver.","Envelhece quando vocês ficam perto. A Ouija custa sanidade: em 0%, risco de caçada amaldiçoada.","Deildegast (objetos), Obambo, Deogen."],
25:["Sem crucifixo, incenso ou sal: velocidade normal. Depois de uma proteção: enfurecido e mais rápido (cerca de 1,96 m/s, até 3,2 m/s). Depois de uma caçada enfurecida: enfraquecido e mais lento (cerca de 1,36 m/s).","Enfurecido, pode passar pelo sal sem mexer nele.","Wraith, Obambo, Demon."],
26:["A menos de 10 m na caçada: parado, cai para 1,2 m/s; andando, sobe para 2,25 m/s.","Sempre feminina.","Kormos, Deogen, Revenant."],
27:["Cronômetro desde a primeira abertura de uma porta de saída: calmo de 0 a 1 min, agressivo de 1 a 3, depois alterna a cada 2 min. Calmo cerca de 1,45 m/s, agressivo cerca de 1,96 m/s.","Caçadas iniciadas no modo agressivo duram 20% menos.","The Twins, Gallu, Hantu."],
28:["Quase cego na caçada: parado e visível a mais de 5 m, ele te ignora. Acelera na direção dos seus passos (até cerca de 3,7 m/s).","Nunca faz o evento de névoa nem de perseguição.","Dayan, Yokai, Oni, Banshee."],
29:["Velocidade base lenta (cerca de 1,53 m/s). Ao te ver acelera mais rápido que qualquer outro (cerca de 2,53 m/s em 9 s). Se te alcança num esconderijo oficial, a caçada para na hora.","A caçada seguinte começa sem período de graça, direto ao seu esconderijo.","The Twins (velocidade lenta), Moroi."],
30:["3 m/s no início de cada caçada, menos 0,1 m/s para cada objeto diferente da casa movido antes (mínimo 0,4). Não acelera ao te ver.","A contagem zera após cada caçada ou crucifixo queimado.","Revenant, Deogen, Thaye, Moroi."]}};

g:{0:["Благовония и таймер: нет охоты 180 с (90 с у остальных, 60 с у Demon). Повтори 2–3 раза.","Других признаков нет: скорость и поведение обычные.","Shade (тест присутствия), Demon (60 с)."],
1:["Проходит по соли, не задевая её. Докажи проход: охота, событие или датчик сразу за линией. Без распятия и благовоний до теста.","Телепорт: ЭМП у ног игрока далеко от его комнаты, без взаимодействия.","Разъярённый Gallu (всегда топчет первую кучку), Mimic."],
2:["Фото во время события: сразу исчезает и не виден на снимке.","На охоте почти всегда невидим.","Obake (остаётся на фото)."],
3:["Сложи кучку из десятка предметов в его комнате: бросает несколько сразу.","На охоте почти непрерывно бросает предметы: пытается бросить ближайший раз в 0,5 с.","The Twins (два взаимодействия в двух местах), Deildegast."],
4:["Параболический микрофон: характерный пронзительный крик. В группе на охоте игнорирует видимого игрока, если он не её цель.","Всегда женщина. Не меняет комнату, но уходит далеко за целью.","Kormos (игнорирует всех неподвижных), Goryo."],
5:["Щиток включён: увидев тебя дальше 3 м, разгоняется до 2,5 м/с, рядом замедляется. Щиток выключен: обычная скорость.","Никогда сам не выключает щиток.","Raiju: выключи щиток, оставь электронику включённой."],
6:["Включи свет: иногда выключает его через секунду-две. Никогда не включает свет.","Уходит или меняет комнату, когда там горит свет.","Goryo (остаётся в комнате и при свете)."],
7:["Спрятавшись тихо, без электроники: очень медленные шаги (1 м/с), затем резко 3 м/с, когда замечает тебя.","Потеряв тебя, бежит к последней точке, потом снова медленный.","Старый Thaye, Hantu в тепле, Kormos, Deildegast."],
8:["Будь в её комнате: не может начать охоту и почти не взаимодействует.","Очень робкая, активнее, когда вы далеко. У круга призыва или шкатулки появляется только тенью.","Spirit (благовония 180 с), спокойный Obambo, Goryo."],
9:["Благовония и таймер: охота возможна уже через 60 с (90 с у остальных).","Распятие действует на него на 50% дальше. Может снова охотиться через 20 с после охоты (25 с у остальных).","Onryo (огонь), молодой Thaye, Gallu, агрессивный Obambo."],
10:["Благовония в его комнате: заперт там на 90 с. Поставь соль и датчики у выходов.","Единственный закрывает входную дверь вне охоты И вне событий.","Goryo (может выйти за эти 90 с), Shade."],
11:["Никогда не делает событие «туман».","На охоте хорошо виден, очень активен рядом с игроками. Виден около 60% времени охоты (у остальных около 30%).","Kormos (тоже без тумана, но никогда без преследования)."],
12:["На охоте слышит голос только с ~2,5 м: спрячься на 4–6 м и говори — он не идёт к тебе.","Вне охоты разговоры рядом делают его агрессивнее.","Kormos (реагирует на шаги, не на голос)."],
13:["Скорость зависит от температуры: медленный в тепле (~1,4 м/с), быстрый в холоде (~2,7 м/с). Не ускоряется, видя тебя.","Щиток выключен: на охоте видно холодное дыхание. Никогда не включает щиток обратно.","Revenant, спокойный Obambo."],
14:["Только короткие прогулки: датчики дальше 4 м от комнаты не срабатывают вне охоты и событий. Никогда не меняет комнату.","Без улик 100% теста нет: остаётся, когда всё остальное исключено.","Banshee, Yurei, Shade."],
15:["Фонарик включён на охоте: мигает раньше, чем слышны шаги (слышны с ~12 м вместо 20 м).","Больше звуков в параболическом микрофоне.","Raiju (ускоряется у электроники), Revenant."],
16:["Горящая свеча рядом с распятием: задувает свечу вместо охоты, распятие не сгорает. После 3-го задутого огня охотится.","Каждый раз зажигай свечу снова, чтобы считать.","Demon (часто охотится, огонь его не останавливает)."],
17:["Разная скорость от охоты к охоте (~1,5 или ~1,9 м/с), случайно.","Два взаимодействия почти одновременно в двух местах.","Obambo (скорость по таймеру), Poltergeist."],
18:["Включённая электроника на его пути: там 2,5 м/с, даже не видя тебя.","Заставляет электронику мигать с большего расстояния.","Jinn (зависит от щитка), Myling, Dayan."],
19:["Меняет облик во время охоты.","Отпечатки с 6 пальцами, исчезают быстрее (если есть УФ).","Phantom (исчезает на фото)."],
20:["Всегда показывает огоньки на камере, даже при 0 уликах. Поставь камеру в его комнату.","Копирует способности других призраков и меняет облик по ходу игры.","Все призраки."],
21:["При 0%: быстрая, не видя тебя (~2,3 м/с), затем до ~3,7 м/с, когда видит.","Благовония на охоте: ослеплена 7,5/9/10,5 с вместо 5/6/7 с (уровни I, II, III).","Dayan, молодой Thaye, Kormos, Deildegast, Aswang."],
22:["Очень быстрый издалека (3 м/с), почти стоит рядом с тобой (0,4 м/с).","Всегда знает, где игроки: прятаться бесполезно.","Revenant (наоборот), Dayan."],
23:["Быстрый в начале (~2,75 м/с), стареет и замедляется до 1 м/с. Никогда не ускоряется, видя тебя.","Стареет, когда вы рядом. Уиджа стоит рассудка: при 0% риск проклятой охоты.","Deildegast (предметы), Obambo, Deogen."],
25:["Без распятия, благовоний и соли: обычная скорость. После защиты: разъярён и быстрее (~1,96 м/с, до 3,2 м/с). После разъярённой охоты: ослаблен и медленнее (~1,36 м/с).","Разъярённый может пройти по соли, не задев её.","Wraith, Obambo, Demon."],
26:["Ближе 10 м на охоте: стоишь — 1,2 м/с; двигаешься — 2,25 м/с.","Всегда женщина.","Kormos, Deogen, Revenant."],
27:["Таймер с первого открытия выходной двери: спокоен 0–1 мин, агрессивен 1–3, затем смена каждые 2 мин. Спокоен ~1,45 м/с, агрессивен ~1,96 м/с.","Охоты, начатые в агрессивном состоянии, на 20% короче.","The Twins, Gallu, Hantu."],
28:["Почти слеп на охоте: неподвижного и видимого дальше 5 м игнорирует. Ускоряется на звук шагов (до ~3,7 м/с).","Никогда не делает туман или преследование.","Dayan, Yokai, Oni, Banshee."],
29:["Медленная базовая скорость (~1,53 м/с). Видя тебя, ускоряется быстрее всех (~2,53 м/с за 9 с). Если настигает в официальном укрытии, охота сразу заканчивается.","Следующая охота без льготного периода, сразу к твоему укрытию.","The Twins (медленная скорость), Moroi."],
30:["3 м/с в начале каждой охоты, минус 0,1 м/с за каждый разный предмет дома, сдвинутый до охоты (минимум 0,4). Не ускоряется, видя тебя.","Счёт сбрасывается после каждой охоты или сгоревшего распятия.","Revenant, Deogen, Thaye, Moroi."]}}})();

g:{0:["熏香后计时：180 秒内不会狩猎（其他鬼魂 90 秒，Demon 60 秒）。重复 2–3 次。","没有其他特征：速度和行为都正常。","Shade（在场测试）、Demon（60 秒）。"],
1:["经过盐而不弄乱它。要证明它经过了：狩猎、事件或盐线后的传感器。测试前不要用十字架或熏香。","瞬移：远离其房间的玩家脚下出现 EMF，没有互动。","暴怒的 Gallu（总会踩第一堆盐）、Mimic。"],
2:["事件中拍照：它立刻消失且不出现在照片里。","狩猎时几乎一直隐形。","Obake（会出现在照片里）。"],
3:["在它房间堆十个左右的物品：它会一次扔出好几个。","狩猎时几乎不停地扔东西：每 0.5 秒尝试扔一个附近物品。","The Twins（两处互动）、Deildegast。"],
4:["抛物面麦克风：特有的尖叫。多人时，狩猎中会无视不是其目标的可见玩家。","总是女性。从不换房间，但会走很远跟随目标。","Kormos（无视所有静止玩家）、Goryo。"],
5:["电闸开着：在 3 米外看到你会以 2.5 米/秒冲刺，靠近后减速。电闸关闭：正常速度。","从不自己关电闸。","Raiju：关掉电闸，保持电子设备开启。"],
6:["开灯：它有时会在一两秒后关掉。它从不开灯。","房间亮灯时会离开或换房间。","Goryo（即使亮灯也留在房间）。"],
7:["躲起来、保持安静、关掉电子设备：脚步很慢（1 米/秒），发现你时瞬间变 3 米/秒。","跟丢你后冲到你最后的位置，然后再变慢。","年老的 Thaye、暖处的 Hantu、Kormos、Deildegast。"],
8:["和它待在同一房间：它无法开始狩猎，几乎不互动。","非常害羞，你们离开时更活跃。在召唤阵或音乐盒处只以影子出现。","Spirit（熏香 180 秒）、平静的 Obambo、Goryo。"],
9:["熏香后计时：60 秒起就可能狩猎（其他鬼魂 90 秒）。","十字架对它的范围大 50%。狩猎结束后 20 秒就能再次狩猎（其他 25 秒）。","Onryo（火焰）、年轻的 Thaye、Gallu、暴躁的 Obambo。"],
10:["在它房间熏香：它会被困在房间里 90 秒。在出口放盐和传感器。","唯一能在非狩猎且非事件时关上大门的鬼魂。","Goryo（90 秒内可能离开）、Shade。"],
11:["从不做雾气事件。","狩猎时非常显眼，玩家附近很活跃。狩猎中约 60% 的时间可见（其他鬼魂约 30%）。","Kormos（也没有雾气，但从不追逐）。"],
12:["狩猎时只能听到约 2.5 米内的说话声：躲在 4–6 米外说话，它不会过来。","非狩猎时在它附近说话会让它更具攻击性。","Kormos（对脚步声有反应，而不是说话声）。"],
13:["速度取决于温度：暖处慢（约 1.4 米/秒），冷处快（约 2.7 米/秒）。看到你不会加速。","电闸关闭时狩猎中可见寒气呼吸。从不重新打开电闸。","Revenant、平静的 Obambo。"],
14:["只做短距离游荡：离房间 4 米外的传感器在非狩猎、非事件时从不触发。从不换房间。","没有证据时没有 100% 的测试：其他都排除后留下的就是它。","Banshee、Yurei、Shade。"],
15:["狩猎时开着手电筒：在你听到脚步前手电就会闪（约 12 米才听得到，其他为 20 米）。","抛物面麦克风中声音更多。","Raiju（靠近电子设备加速）、Revenant。"],
16:["点燃的蜡烛放在十字架旁：它会吹灭蜡烛而不是狩猎，十字架不烧。吹灭第 3 个火焰后会狩猎。","每次都重新点燃蜡烛以便计数。","Demon（经常狩猎，火焰拦不住）。"],
17:["每次狩猎速度不同（约 1.5 或 1.9 米/秒），随机。","两个地方几乎同时发生互动。","Obambo（速度按计时变化）、Poltergeist。"],
18:["在它路线上放开着的电子设备：经过时达到 2.5 米/秒，即使看不到你。","在更远的距离就让电子设备闪烁。","Jinn（取决于电闸）、Myling、Dayan。"],
19:["狩猎时改变外形。","六指指纹，消失得更快（若有紫外线证据）。","Phantom（拍照会消失）。"],
20:["即使 0 证据，摄像机里也总会出现灵球。在它房间放一台摄像机。","复制其他鬼魂的能力，并在游戏中更换模型。","所有鬼魂。"],
21:["0% 时：没看到你也很快（约 2.3 米/秒），看到你后最高约 3.7 米/秒。","狩猎中熏香：致盲 7.5/9/10.5 秒，而不是 5/6/7 秒（I、II、III 级）。","Dayan、年轻的 Thaye、Kormos、Deildegast、Aswang。"],
22:["远处非常快（3 米/秒），到你身边几乎停下（0.4 米/秒）。","总知道玩家在哪：躲起来没用。","Revenant（正好相反）、Dayan。"],
23:["开局很快（约 2.75 米/秒），随着变老减速到 1 米/秒。看到你从不加速。","你们待在它附近时它会变老。通灵板会消耗理智：0% 时有诅咒狩猎的风险。","Deildegast（物品）、Obambo、Deogen。"],
25:["不用十字架、熏香、盐：正常速度。使用防护后：暴怒且更快（约 1.96 米/秒，最高 3.2 米/秒）。暴怒狩猎结束后：虚弱且更慢（约 1.36 米/秒）。","暴怒时可以经过盐而不弄乱它。","Wraith、Obambo、Demon。"],
26:["狩猎时在 10 米内：你站着不动它降到 1.2 米/秒；你移动它升到 2.25 米/秒。","总是女性。","Kormos、Deogen、Revenant。"],
27:["从第一次打开出口门开始计时：0–1 分钟平静，1–3 分钟暴躁，之后每 2 分钟切换。平静约 1.45 米/秒，暴躁约 1.96 米/秒。","暴躁状态开始的狩猎短 20%。","The Twins、Gallu、Hantu。"],
28:["狩猎时几乎失明：你在 5 米外静止且可见，它会无视你。朝你的脚步声加速（最高约 3.7 米/秒）。","从不做雾气或追逐事件。","Dayan、Yokai、Oni、Banshee。"],
29:["基础速度慢（约 1.53 米/秒）。看到你时加速比任何鬼魂都快（9 秒约 2.53 米/秒）。在官方藏身处抓到你时狩猎立即结束。","下一次狩猎没有宽限期，直奔你的藏身处。","The Twins（慢速）、Moroi。"],
30:["每次狩猎开始时 3 米/秒，狩猎前每移动一个不同的房屋物品就减 0.1 米/秒（最低 0.4）。看到你不会加速。","每次狩猎或十字架燃烧后重新计数。","Revenant、Deogen、Thaye、Moroi。"]}};

g:{0:["Kadzidło i stoper: brak polowania przez 180 s (90 s u innych, 60 s u Demona). Powtórz 2–3 razy.","Brak innych oznak: normalna prędkość i zachowanie.","Shade (test obecności), Demon (60 s)."],
1:["Przechodzi przez sól, nie ruszając jej. Potwierdź przejście: polowanie, zdarzenie lub czujnik tuż za linią. Bez krucyfiksu i kadzidła przed testem.","Teleport: EMF przy stopach gracza, daleko od jego pokoju, bez interakcji.","Wściekły Gallu (zawsze depcze pierwszą kupkę), Mimic."],
2:["Zdjęcie podczas zdarzenia: od razu znika i nie ma go na zdjęciu.","W polowaniu prawie zawsze niewidoczny.","Obake (zostaje na zdjęciu)."],
3:["Zrób kupkę z około dziesięciu przedmiotów w jego pokoju: rzuca kilkoma naraz.","W polowaniu rzuca prawie bez przerwy: próbuje rzucić pobliski przedmiot co 0,5 s.","The Twins (dwie interakcje w dwóch miejscach), Deildegast."],
4:["Mikrofon paraboliczny: charakterystyczny wysoki krzyk. W drużynie, w polowaniu ignoruje widocznego gracza, który nie jest jej celem.","Zawsze kobieta. Nigdy nie zmienia pokoju, ale idzie daleko za celem.","Kormos (ignoruje wszystkich nieruchomych), Goryo."],
5:["Bezpieczniki włączone: gdy widzi cię z ponad 3 m, rusza 2,5 m/s i zwalnia przy tobie. Wyłączone: normalna prędkość.","Nigdy sam nie wyłącza bezpieczników.","Raiju: wyłącz bezpieczniki, zostaw włączoną elektronikę."],
6:["Zapal światło: czasem gasi je po sekundzie lub dwóch. Nigdy nie zapala światła.","Opuszcza lub zmienia pokój, gdy jest w nim światło.","Goryo (zostaje w pokoju nawet przy świetle)."],
7:["Ukryty, cicho, bez elektroniki: bardzo wolne kroki (1 m/s), potem nagle 3 m/s, gdy cię wykryje.","Gdy cię zgubi, biegnie do ostatniej pozycji i znów zwalnia.","Stary Thaye, Hantu w cieple, Kormos, Deildegast."],
8:["Bądź w tym samym pokoju: nie może zacząć polowania i prawie nic nie robi.","Bardzo nieśmiała, aktywniejsza, gdy jesteście daleko. Przy kręgu przywołania lub pozytywce pojawia się tylko jako cień.","Spirit (kadzidło 180 s), spokojny Obambo, Goryo."],
9:["Kadzidło i stoper: polowanie możliwe już po 60 s (90 s u innych).","Krucyfiks działa na niego o 50% dalej. Może znów polować 20 s po polowaniu (25 s u innych).","Onryo (płomienie), młody Thaye, Gallu, agresywny Obambo."],
10:["Kadzidło w jego pokoju: zostaje tam uwięziony na 90 s. Połóż sól i czujniki przy wyjściach.","Jedyny zamyka drzwi wejściowe poza polowaniem I poza zdarzeniem.","Goryo (może wyjść w ciągu 90 s), Shade."],
11:["Nigdy nie robi zdarzenia z mgłą.","Bardzo widoczny w polowaniu, bardzo aktywny przy graczach. Widoczny przez ok. 60% polowania (inni ok. 30%).","Kormos (też bez mgły, ale nigdy pościgu)."],
12:["W polowaniu słyszy głos tylko z ok. 2,5 m: ukryj się 4–6 m dalej i mów — nie przyjdzie.","Poza polowaniem mówienie obok czyni go agresywniejszym.","Kormos (reaguje na kroki, nie na głos)."],
13:["Prędkość zależy od temperatury: wolny w cieple (ok. 1,4 m/s), szybki w zimnie (ok. 2,7 m/s). Nie przyspiesza, gdy cię widzi.","Bezpieczniki wyłączone: widoczny mroźny oddech w polowaniu. Nigdy nie włącza bezpieczników z powrotem.","Revenant, spokojny Obambo."],
14:["Tylko krótkie spacery: czujniki ponad 4 m od pokoju nie włączają się poza polowaniem i zdarzeniem. Nigdy nie zmienia pokoju.","Bez dowodów nie ma testu na 100%: zostaje, gdy reszta jest wykluczona.","Banshee, Yurei, Shade."],
15:["Latarka włączona w polowaniu: miga, zanim usłyszysz kroki (słychać je z ok. 12 m zamiast 20 m).","Więcej dźwięków w mikrofonie parabolicznym.","Raiju (przyspiesza przy elektronice), Revenant."],
16:["Zapalona świeca obok krucyfiksu: gasi świecę zamiast polować, krucyfiks się nie pali. Po 3. zgaszonym płomieniu poluje.","Za każdym razem zapal świecę ponownie, by liczyć.","Demon (często poluje, płomień go nie zatrzymuje)."],
17:["Inna prędkość w każdym polowaniu (ok. 1,5 lub 1,9 m/s), losowo.","Dwie interakcje prawie naraz w dwóch miejscach.","Obambo (prędkość według stopera), Poltergeist."],
18:["Włączona elektronika na jego drodze: tam 2,5 m/s, nawet gdy cię nie widzi.","Sprawia, że elektronika miga z większej odległości.","Jinn (zależy od bezpieczników), Myling, Dayan."],
19:["Zmienia wygląd podczas polowania.","Odciski z 6 palcami, szybciej znikają (jeśli jest UV).","Phantom (znika na zdjęciu)."],
20:["Zawsze pokazuje kule na kamerze, nawet przy 0 dowodach. Postaw kamerę w jego pokoju.","Kopiuje zdolności innych duchów i zmienia wygląd w trakcie gry.","Wszystkie duchy."],
21:["Przy 0%: szybki, nie widząc cię (ok. 2,3 m/s), potem do ok. 3,7 m/s, gdy widzi.","Kadzidło w polowaniu: oślepiony na 7,5/9/10,5 s zamiast 5/6/7 s (poziomy I, II, III).","Dayan, młody Thaye, Kormos, Deildegast, Aswang."],
22:["Bardzo szybki z daleka (3 m/s), prawie stoi tuż przy tobie (0,4 m/s).","Zawsze wie, gdzie są gracze: chowanie się nie pomaga.","Revenant (odwrotnie), Dayan."],
23:["Szybki na początku (ok. 2,75 m/s), potem starzeje się i zwalnia do 1 m/s. Nigdy nie przyspiesza, gdy cię widzi.","Starzeje się, gdy jesteście blisko. Ouija kosztuje poczytalność: przy 0% ryzyko przeklętego polowania.","Deildegast (przedmioty), Obambo, Deogen."],
25:["Bez krucyfiksu, kadzidła i soli: normalna prędkość. Po ochronie: wściekły i szybszy (ok. 1,96 m/s, do 3,2 m/s). Po wściekłym polowaniu: osłabiony i wolniejszy (ok. 1,36 m/s).","Wściekły może przejść przez sól, nie ruszając jej.","Wraith, Obambo, Demon."],
26:["W polowaniu bliżej niż 10 m: stoisz — 1,2 m/s; ruszasz się — 2,25 m/s.","Zawsze kobieta.","Kormos, Deogen, Revenant."],
27:["Stoper od pierwszego otwarcia drzwi wyjściowych: spokojny 0–1 min, agresywny 1–3, potem zmiana co 2 min. Spokojny ok. 1,45 m/s, agresywny ok. 1,96 m/s.","Polowania zaczęte w stanie agresywnym są o 20% krótsze.","The Twins, Gallu, Hantu."],
28:["Prawie ślepy w polowaniu: nieruchomego i widocznego z ponad 5 m ignoruje. Przyspiesza w stronę twoich kroków (do ok. 3,7 m/s).","Nigdy nie robi mgły ani pościgu.","Dayan, Yokai, Oni, Banshee."],
29:["Wolna prędkość bazowa (ok. 1,53 m/s). Gdy cię widzi, przyspiesza szybciej niż każdy inny (ok. 2,53 m/s w 9 s). Jeśli dopadnie cię w oficjalnej kryjówce, polowanie od razu się kończy.","Następne polowanie bez okresu ochronnego, prosto do twojej kryjówki.","The Twins (wolna prędkość), Moroi."],
30:["3 m/s na początku każdego polowania, minus 0,1 m/s za każdy inny przedmiot z domu przesunięty wcześniej (minimum 0,4). Nie przyspiesza, gdy cię widzi.","Licznik zeruje się po każdym polowaniu lub spalonym krucyfiksie.","Revenant, Deogen, Thaye, Moroi."]}}})();

1:["소금을 건드리지 않고 지나간다. 지나간 것을 확인하세요: 사냥, 이벤트, 소금선 뒤 감지기. 테스트 전 십자가와 향 금지.","순간이동: 방에서 먼 플레이어 발밑에 상호작용 없는 EMF.","격노한 Gallu (첫 소금은 항상 밟음), Mimic."],
2:["이벤트 중 사진: 즉시 사라지고 사진에 나오지 않는다.","사냥 중 거의 항상 보이지 않음.","Obake (사진에 나옴)."],
3:["방에 물건 10개 정도를 쌓으면: 여러 개를 한꺼번에 던진다.","사냥 중 거의 쉬지 않고 던진다: 0.5초마다 근처 물건을 던지려 함.","The Twins (두 곳의 상호작용), Deildegast."],
4:["파라볼릭 마이크: 특유의 날카로운 비명. 그룹일 때 사냥 중 목표가 아닌 보이는 플레이어를 무시한다.","항상 여성. 방을 바꾸지 않지만 목표를 따라 멀리 이동.","Kormos (멈춘 플레이어 모두 무시), Goryo."],
5:["두꺼비집 켜짐: 3 m 넘게 떨어져 당신을 보면 2.5 m/s로 돌진, 가까워지면 감속. 꺼짐: 보통 속도.","스스로 두꺼비집을 끄지 않는다.","Raiju: 두꺼비집을 끄고 전자기기는 켜 두세요."],
6:["불을 켜면: 가끔 1~2초 뒤 끈다. 절대 불을 켜지 않는다.","방에 불이 켜지면 떠나거나 방을 바꾼다.","Goryo (불이 켜져도 방에 머묾)."],
7:["숨어서 조용히, 전자기기 끔: 아주 느린 발소리(1 m/s), 발견하면 순간 3 m/s.","놓치면 마지막 위치로 달려간 뒤 다시 느려진다.","늙은 Thaye, 따뜻한 곳의 Hantu, Kormos, Deildegast."],
8:["같은 방에 있으면: 사냥을 시작할 수 없고 거의 상호작용하지 않는다.","매우 수줍고, 멀리 있을 때 더 활발. 소환진이나 오르골에서는 그림자로만 나타남.","Spirit (향 180초), 차분한 Obambo, Goryo."],
9:["향과 타이머: 60초부터 사냥 가능 (다른 유령 90초).","십자가 범위가 50% 넓게 적용됨. 사냥이 끝나고 20초 뒤 다시 사냥 가능 (다른 유령 25초).","Onryo (불꽃), 젊은 Thaye, Gallu, 공격적인 Obambo."],
10:["방에서 향: 90초 동안 방에 갇힌다. 출구에 소금과 감지기를 두세요.","사냥과 이벤트 밖에서 현관문을 닫는 유일한 유령.","Goryo (90초 안에 나갈 수 있음), Shade."],
