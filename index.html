<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phasmo Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: carnet de terrain d'un chasseur, lu à la lampe UV dans le camion
   IDEA: le journal du jeu — on coche ce qu'il fait, on barre ce qu'il ne fait pas
   PICTURE: la grille des 30 entités qui se barre en direct, à côté des signes
   COLOUR and TYPE: nuit #101118, violet UV #9a6bff, crayon rouge #ff5a4e ; Kalam + Atkinson Hyperlegible
   LAYOUT: barre d'outils, deux pages (signes | entités), tests en bas ; empilé sous 900px */
:root{color-scheme:light dark;
--bg:light-dark(#f3f2f7,#101118);--page:light-dark(#ffffff,#181a24);--ink:light-dark(#1b1a24,#e9e7f2);
--mute:light-dark(#5d5a6e,#a19eb4);--line:light-dark(#dcd9e6,#2b2d3c);--uv:light-dark(#5a2fd0,#9a6bff);
--uvbg:light-dark(#efe8ff,#221c3a);--red:light-dark(#c4271c,#ff5a4e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.gn{font-family:Kalam,"Comic Sans MS",cursive;font-weight:700}
h1{font-size:clamp(30px,4vw,44px);line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:26px;line-height:1.1;margin:0 0 10px}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(16px,3vw,32px) max(4vw,14px)}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.top p{margin:6px 0 0;color:var(--mute);max-width:62ch}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{display:flex;align-items:center;gap:8px;background:var(--page);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;cursor:pointer;font-size:15px}
.sw input{width:20px;height:20px;accent-color:var(--uv)}
button{font:inherit;color:inherit;cursor:pointer}
.pri{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--uv);background:var(--uv);color:#fff}
:focus-visible{outline:3px solid var(--uv);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.pg{background:var(--page);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.side{position:sticky;top:12px}
details{border-top:1px solid var(--line)}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 2px;min-height:44px}
summary::-webkit-details-marker{display:none}
summary h3{margin:0;font-size:21px}
summary .n{font-size:13px;color:var(--uv);background:var(--uvbg);border-radius:20px;padding:2px 9px;white-space:nowrap}
summary::after{content:"+";font-size:22px;color:var(--mute);width:20px;text-align:center}
details[open]>summary::after{content:"−"}
.fam>summary{padding:14px 2px}
.fam>summary h3{font-size:26px}
.fs{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.sub{margin:0 0 6px 10px;border-top:1px dashed var(--line)}
.sub>summary{padding:8px 2px;min-height:40px}
.sub h4{margin:0;font-size:16px;font-weight:700;color:var(--uv)}
.sub>summary::after{font-size:18px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--mute);padding-bottom:10px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.ob{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;padding:9px 6px;border-radius:9px;width:100%;text-align:left;border:0;background:transparent;min-height:44px}
.ob:hover{background:var(--uvbg)}
.bx{width:24px;height:24px;border:2px solid var(--mute);border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:16px;line-height:1;margin-top:1px}
.leg .bx{width:20px;height:20px;font-size:13px}
.ob.yes .bx,.bx.y{background:var(--uv);border-color:var(--uv);color:#fff}
.ob.no .bx,.bx.x{border-color:var(--red);color:var(--red)}
.ob.no b{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;color:var(--mute)}
.ob b{font-weight:700}
.ob small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:1px}
.t-only{background:var(--uvbg);color:var(--uv)}.t-elim{background:light-dark(#ffe3df,#3a1a18);color:var(--red)}.t-no{background:light-dark(#f1eef6,#26283a);color:var(--mute)}
.simple{margin-top:18px}.sp0{color:var(--mute);margin:0 0 10px}#sh{display:block;font-size:13px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.sbox{border:1px solid var(--line);border-radius:12px;padding:8px 8px 4px}.sbox h4{margin:2px 6px 4px;font-size:16px;color:var(--uv)}
@media(max-width:600px){.sgrid{grid-template-columns:minmax(0,1fr)}}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-radius:10px}
.row+.row{border-top:1px solid var(--line)}
.row.yes{background:var(--uvbg)}.row.no{background:light-dark(#ffe9e6,#331a19)}
.row b{font-weight:700}
.row.no b{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;color:var(--mute)}
.row small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--page);min-width:52px;min-height:44px;font-size:14px;font-weight:700;color:var(--mute)}
.seg button+button{border-left:1px solid var(--line)}
.seg .y[aria-pressed=true]{background:var(--uv);color:#fff}
.seg .n[aria-pressed=true]{background:var(--red);color:#fff}
.row.off{opacity:.42}.row.off b{font-weight:400}.why2{font-style:italic}
.seg button:disabled{cursor:not-allowed;background:transparent}
.sbox.alloff h4{color:var(--mute)}
.setp{margin-bottom:18px;padding:4px 18px 14px;--rd:light-dark(#a8443b,#d4837a);border:2px solid var(--rd);background:light-dark(#fcf1ef,#22171a)}
.setp>summary h3{color:var(--rd)}.setp .fs{color:light-dark(#7d4a44,#c9a39e)}
.setp .fld span,.setp .eqt{color:light-dark(#7d4a44,#c9a39e)}
.setp .fld select{border-color:light-dark(#e2bdb7,#5a3632);background:var(--page)}
.setp .eqc{border-color:light-dark(#e2bdb7,#5a3632);background:var(--page)}.setp .eqc input{accent-color:var(--rd)}
.setp .sinfo{color:var(--rd)}.setp>summary::after{color:var(--rd)}
.lng select{font:inherit;font-size:15px;border:0;background:transparent;color:var(--ink);min-height:30px;cursor:pointer}
.setp>summary h3{font-size:24px}
.sgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 14px;margin-top:4px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}
.fld select{font:inherit;font-size:16px;min-height:44px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.eqt{font-size:14px;color:var(--mute);margin:14px 0 6px}
.eqs{display:flex;flex-wrap:wrap;gap:6px}
.eqc{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;padding:6px 12px;min-height:40px;font-size:14px;cursor:pointer}
.eqc input{width:18px;height:18px;accent-color:var(--uv)}
.sinfo{margin:12px 0 0;font-size:14px;color:var(--uv)}
.ob.na{opacity:.42}.ob:disabled{cursor:not-allowed}.ob.na:hover{background:transparent}
.sbar{display:block;position:sticky;top:0;z-index:2;background:var(--page);padding:2px 0 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.slb{display:block;font-family:Kalam,cursive;font-weight:700;font-size:20px;color:var(--uv);margin-bottom:4px}
.sin{position:relative;display:block}
.sin svg{position:absolute;left:14px;top:50%;width:22px;height:22px;transform:translateY(-50%);color:var(--uv);pointer-events:none}
.sin input{width:100%;font:inherit;font-size:17px;min-height:52px;padding:10px 14px 10px 46px;border-radius:12px;border:2px solid var(--uv);background:var(--uvbg);color:var(--ink)}
.sin input::placeholder{color:var(--mute)}
.sin input:focus{outline:none;box-shadow:0 0 0 4px light-dark(#d9ccff,#3a2c6b)}
.hid{font-size:13px;color:var(--mute);margin:4px 0 8px 10px}
.count{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.count strong{font-family:Kalam,cursive;font-size:clamp(40px,6vw,56px);line-height:1;color:var(--uv)}
.ghosts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.g{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-items:center;text-align:left;padding:6px 8px;border-radius:9px;min-height:48px;background:transparent;border:1px solid var(--line)}
.g .id{font-size:13px;font-weight:700;text-align:center;border-radius:7px;padding:3px 0;background:var(--uvbg);color:var(--uv);font-variant-numeric:tabular-nums}
.g .gn{font-size:19px;line-height:1.05;display:block}
.g .en{font-size:12px;color:var(--mute);display:block}
.g.out{opacity:.55}
.g.out .gn{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:3px}
.g.out .id{background:transparent;color:var(--mute)}
.why{font-size:12px;color:var(--red);display:block;line-height:1.25;margin-top:2px}
.verdict{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--uvbg);color:var(--uv);font-weight:700;display:none}
.idf input{width:100%;font:inherit;font-size:16px;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:14px}
.idr{min-height:22px;font-size:15px;color:var(--mute);margin:6px 0}
.idr b{color:var(--uv)}
.idt{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:2px 10px;font-size:13px;color:var(--mute);margin-top:6px}
.idt span b{display:inline-block;width:24px;text-align:right;margin-right:6px;color:var(--ink);font-variant-numeric:tabular-nums}
.tests{margin-top:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--page);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h3{margin:0;font-size:24px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.card h3 .id{font-family:"Atkinson Hyperlegible",sans-serif;font-size:13px;color:var(--uv);background:var(--uvbg);border-radius:6px;padding:1px 7px}
.card h3 .en{font-family:"Atkinson Hyperlegible",sans-serif;font-size:13px;color:var(--mute);font-weight:400}
.card p{margin:8px 0 0;font-size:15px}
.card .lb{font-weight:700;color:var(--uv)}
.card .sp{color:var(--mute);font-size:14px}
.empty{color:var(--mute)}
.note{color:var(--mute);font-size:13px;margin-top:14px}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.side{position:static;order:-1}}
@media(max-width:600px){.cards{grid-template-columns:minmax(0,1fr)}.g{grid-template-columns:minmax(0,1fr);gap:2px;padding:6px}.g .id{width:30px}.g .gn{font-size:17px}}
@media(prefers-reduced-motion:no-preference){.g{transition:opacity .25s,background .25s}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Phasmo Zero</h1>
      <p><b data-i="tag"></b> <span data-i="intro"></span></p>
    </div>
    <div class="tools">
      <label class="sw lng"><span data-i="lang"></span><select id="lng"></select></label>
      <label class="sw"><input type="checkbox" id="mim"> <span data-i="mim"></span></label>
      <button id="reset" class="pri" data-i="reset"></button>
    </div>
  </div>

  <details class="pg setp" id="setp" open><summary><span><h3 data-i="settings"></h3><small class="fs" id="setsum"></small></span></summary><div id="sets"></div></details>

  <div class="grid">
    <div class="pg"><label class="sbar" for="fs"><span class="slb" data-i="searchLbl"></span><span class="sin"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><input id="fs" type="search" data-ip="searchPh" autocomplete="off"></span></label><div id="obs"></div></div>
    <aside class="pg side">
      <div class="count"><strong id="nb">30</strong><span id="nbt"></span></div>
      <div class="ghosts" id="gl"></div>
      <div class="verdict" id="vd"></div>
      <div class="idf"><input id="q" type="search" data-ip="findPh" autocomplete="off"></div>
      <div class="idr" id="qr"></div>
    </aside>
  </div>

  <section class="pg simple">
    <h2 data-i="simpleH"></h2>
    <p class="sp0"><span data-i="simpleP"></span> <span id="sh"></span></p>
    <div class="sgrid" id="sb"></div>
  </section>

  <section class="tests">
    <h2 id="tt"></h2>
    <div class="cards" id="cards"></div>
    <p class="note" data-i="note"></p>
  </section>
</div>

<script>
{
const G=[
{id:0,fr:"Esprit",en:"Spirit",t:"Encens, puis chrono : aucune chasse avant 180 s (90 s pour les autres, 60 s pour le Démon). Répète 2 ou 3 fois.",b:"Aucun autre signe : vitesse et comportement normaux.",c:"Ombre (test de présence), Démon (60 s)."},
{id:1,fr:"Spectre",en:"Wraith",t:"Passe sur du sel sans le déranger. Il faut prouver le passage : chasse, événement fantôme ou détecteur juste derrière la ligne. Pas de crucifix ni d'encens avant le test.",b:"Téléportation : un EMF aux pieds d'un joueur, loin de sa pièce, sans aucune interaction.",c:"Gallu enragée (elle écrase toujours le premier tas), Mimic."},
{id:2,fr:"Fantôme",en:"Phantom",t:"Photo pendant un événement fantôme : il disparaît aussitôt et n'apparaît pas sur la photo.",b:"Presque toujours invisible pendant les chasses.",c:"Obake (reste sur la photo)."},
{id:3,fr:"Poltergeist",en:"Poltergeist",t:"Fais un tas d'une dizaine d'objets dans sa pièce : il en projette plusieurs d'un coup.",b:"Lance des objets presque en continu pendant les chasses.",c:"Les Jumeaux (deux interactions à deux endroits), Deildegast."},
{id:4,fr:"Banshee",en:"Banshee",t:"Micro parabolique : cri aigu caractéristique. À plusieurs, en chasse, elle ignore un joueur visible qui n'est pas sa cible.",b:"Toujours féminine. Ne change jamais de pièce, mais se promène loin pour suivre sa cible.",c:"Kormos (ignore tous les joueurs immobiles), Goryo."},
{id:5,fr:"Djinn",en:"Jinn",t:"Disjoncteur allumé : quand il te voit à plus de 3 m, il passe d'un coup à 2,5 m/s, puis ralentit près de toi. Disjoncteur coupé : vitesse normale.",b:"Ne coupe jamais le disjoncteur lui-même.",c:"Raiju : coupe le disjoncteur et garde ton électronique allumée."},
{id:6,fr:"Cauchemar",en:"Mare",t:"Allume une lumière : il l'éteint parfois une ou deux secondes après. Il ne rallume jamais une lumière.",b:"Quitte sa pièce, ou en change, quand la lumière y est allumée.",c:"Goryo (reste dans sa pièce même allumée)."},
{id:7,fr:"Revenant",en:"Revenant",t:"Caché, silencieux, électronique éteinte : pas très lents (1 m/s), puis 3 m/s d'un coup quand il te repère.",b:"Quand il te perd, il fonce jusqu'à ta dernière position, puis redevient lent.",c:"Thaye âgé, Hantu au chaud, Kormos, Deildegast."},
{id:8,fr:"Ombre",en:"Shade",t:"Reste dans la même pièce qu'elle : elle ne peut pas lancer de chasse et interagit très peu.",b:"Très discrète, plus active quand vous êtes loin.",c:"Esprit (encens 180 s), Obambo calme, Goryo."},
{id:9,fr:"Démon",en:"Demon",t:"Encens, puis chrono : une chasse est possible dès 60 s (90 s pour les autres).",b:"Le crucifix agit sur lui 50 % plus loin.",c:"Onryo (flammes), Thaye jeune, Gallu, Obambo agressif."},
{id:10,fr:"Yurei",en:"Yurei",t:"Encens dans sa pièce : il y reste bloqué 90 s. Mets du sel et des détecteurs aux sorties.",b:"Seul à fermer la porte d'entrée hors chasse ET hors événement fantôme.",c:"Goryo (peut sortir pendant les 90 s), Ombre."},
{id:11,fr:"Oni",en:"Oni",t:"Ne fait jamais l'événement brume.",b:"Très visible pendant les chasses, très actif près des joueurs.",c:"Kormos (pas de brume non plus, mais jamais d'événement de poursuite)."},
{id:12,fr:"Yokai",en:"Yokai",t:"En chasse, il n'entend ta voix qu'à environ 2,5 m : caché à 4 ou 5 m, parle, il ne vient pas vers toi.",b:"Hors chasse, parler près de lui le rend plus agressif.",c:"Kormos (réagit aux pas, pas à la voix)."},
{id:13,fr:"Hantu",en:"Hantu",t:"Vitesse liée à la température : lent au chaud (environ 1,4 m/s), rapide au froid (environ 2,7 m/s). N'accélère pas en te voyant.",b:"Disjoncteur coupé : souffle froid visible pendant la chasse.",c:"Revenant, Obambo calme."},
{id:14,fr:"Goryo",en:"Goryo",t:"Ne fait que de courtes promenades : des détecteurs à plus de 4 m de sa pièce ne sonnent jamais hors chasse ni événement. Ne change jamais de pièce.",b:"Pas de test à 100 % sans preuves : on le garde quand tout le reste est éliminé.",c:"Banshee, Yurei, Ombre."},
{id:15,fr:"Myling",en:"Myling",t:"Lampe allumée en chasse : elle clignote avant que tu entendes ses pas (audibles à environ 12 m au lieu de 20 m).",b:"Fait plus de bruits au micro parabolique.",c:"Raiju (accélère près de l'électronique), Revenant."},
{id:16,fr:"Onryo",en:"Onryo",t:"Bougie allumée et crucifix côte à côte : il souffle la bougie au lieu de chasser, le crucifix ne brûle pas. Après la 3e flamme soufflée, il chasse.",b:"Rallume la bougie à chaque fois pour suivre le compte.",c:"Démon (chasse souvent, la flamme ne l'arrête pas)."},
{id:17,fr:"Les Jumeaux",en:"The Twins",t:"Vitesse différente d'une chasse à l'autre (environ 1,5 ou 1,9 m/s), au hasard.",b:"Deux interactions presque simultanées à deux endroits.",c:"Obambo (sa vitesse suit un chrono), Poltergeist."},
{id:18,fr:"Raiju",en:"Raiju",t:"Électronique allumée posée sur son trajet : il passe à 2,5 m/s près d'elle, même sans te voir.",b:"Fait clignoter ton électronique de plus loin que les autres.",c:"Djinn (dépend du disjoncteur), Myling, Dayan."},
{id:19,fr:"Obake",en:"Obake",t:"Change d'apparence pendant une chasse.",b:"Empreintes à 6 doigts, qui disparaissent plus vite (si les UV sont actifs).",c:"Fantôme (disparaît sur la photo)."},
{id:20,fr:"Le Mimic",en:"The Mimic",t:"Fait toujours apparaître des orbes à la caméra, même à 0 preuve. Pose une caméra dans sa pièce.",b:"Copie les capacités des autres et change de modèle en cours de partie.",c:"Toutes les entités."},
{id:21,fr:"Moroï",en:"Moroi",t:"À 0 % : rapide sans te voir (environ 2,3 m/s), puis jusqu'à environ 3,7 m/s quand il te voit.",b:"Encens en chasse : aveuglé 7,5, 9 ou 10,5 s au lieu de 5, 6 ou 7 s (niveaux I, II, III).",c:"Dayan, Thaye jeune, Kormos, Deildegast, Aswang."},
{id:22,fr:"Deogen",en:"Deogen",t:"Très rapide de loin (3 m/s), presque à l'arrêt tout près de toi (0,4 m/s).",b:"Sait toujours où sont les joueurs : se cacher ne sert à rien.",c:"Revenant (l'inverse), Dayan."},
{id:23,fr:"Thayé",en:"Thaye",t:"Rapide en début de partie (environ 2,75 m/s), puis il ralentit en vieillissant jusqu'à 1 m/s. N'accélère jamais en te voyant.",b:"Il vieillit quand vous restez près de lui. La Ouija coûte de la santé mentale : à 0 %, risque de chasse maudite.",c:"Deildegast (objets), Obambo, Deogen."},
{id:25,fr:"Gallu",en:"Gallu",t:"Sans crucifix, encens ni sel : vitesse normale. Après une protection : enragée et plus rapide (environ 1,96 m/s, jusqu'à 3,2 m/s). Après une chasse enragée : affaiblie et plus lente (environ 1,36 m/s).",b:"Enragée, elle peut traverser le sel sans le déranger.",c:"Spectre, Obambo, Démon."},
{id:26,fr:"Dayan",en:"Dayan",t:"À moins de 10 m d'elle en chasse : immobile, elle tombe à 1,2 m/s ; si tu bouges, elle monte à 2,25 m/s.",b:"Toujours féminine.",c:"Kormos, Deogen, Revenant."},
{id:27,fr:"Obambo",en:"Obambo",t:"Chrono depuis la première ouverture d'une porte de sortie : calme de 0 à 1 min, agressif de 1 à 3, puis il change toutes les 2 min. Calme environ 1,45 m/s, agressif environ 1,96 m/s.",b:"Les chasses lancées en état agressif sont 20 % plus courtes.",c:"Les Jumeaux, Gallu, Hantu."},

8:["Stay in the same room as it: it can't start a hunt and barely interacts.","Very shy, more active when you're far away.","Spirit (incense 180 s), calm Obambo, Goryo."],
9:["Incense, then timer: a hunt is possible from 60 s (90 s for the others).","The crucifix works on it 50% further.","Onryo (flames), young Thaye, Gallu, aggressive Obambo."],
10:["Incense in its room: it stays stuck there for 90 s. Put salt and sensors at the exits.","Only ghost that closes the front door outside hunts AND outside ghost events.","Goryo (can leave during the 90 s), Shade."],
11:["Never does the mist event.","Very visible during hunts, very active near players.","Kormos (no mist either, but never a chase event)."],
12:["During hunts it only hears your voice at about 2.5 m: hidden 4 or 5 m away, talk, it doesn't come to you.","Outside hunts, talking near it makes it more aggressive.","Kormos (reacts to steps, not voice)."],
13:["Speed tied to temperature: slow in warm rooms (about 1.4 m/s), fast in cold ones (about 2.7 m/s). Doesn't speed up when it sees you.","Fuse box off: cold breath visible during hunts.","Revenant, calm Obambo."],
14:["Only does short roams: sensors more than 4 m from its room never trigger outside hunts or events. Never changes room.","No 100% test without evidence: keep it when everything else is ruled out.","Banshee, Yurei, Shade."],
15:["Flashlight on during a hunt: it flickers before you hear its steps (heard at about 12 m instead of 20 m).","Makes more sounds on the parabolic microphone.","Raiju (speeds up near electronics), Revenant."],
16:["Lit candle and crucifix side by side: it blows out the candle instead of hunting, the crucifix doesn't burn. After the 3rd flame blown out, it hunts.","Relight the candle each time to keep count.","Demon (hunts often, the flame doesn't stop it)."],
17:["Different speed from one hunt to the next (about 1.5 or 1.9 m/s), at random.","Two interactions almost at once in two places.","Obambo (its speed follows a timer), Poltergeist."],
18:["Active electronics placed on its path: it goes to 2.5 m/s near them, even without seeing you.","Makes your electronics flicker from further away than others.","Jinn (depends on the fuse box), Myling, Dayan."],
19:["Changes appearance during a hunt.","6-finger prints that fade faster (if UV is on).","Phantom (vanishes on photo)."],
20:["Always shows orbs on camera, even with 0 evidence. Put a camera in its room.","Copies other ghosts' abilities and changes model during the game.","All ghosts."],
21:["At 0%: fast without seeing you (about 2.3 m/s), then up to about 3.7 m/s when it sees you.","Incense during a hunt: blinded 7.5, 9 or 10.5 s instead of 5, 6 or 7 s (tiers I, II, III).","Dayan, young Thaye, Kormos, Deildegast, Aswang."],
22:["Very fast from afar (3 m/s), almost stopped right next to you (0.4 m/s).","Always knows where players are: hiding is useless.","Revenant (the opposite), Dayan."],
23:["Fast early in the game (about 2.75 m/s), then slows as it ages, down to 1 m/s. Never speeds up when it sees you.","It ages when you stay near it. The Ouija costs sanity: at 0%, risk of a cursed hunt.","Deildegast (objects), Obambo, Deogen."],
25:["Without crucifix, incense or salt: normal speed. After a protection: enraged and faster (about 1.96 m/s, up to 3.2 m/s). After an enraged hunt: weakened and slower (about 1.36 m/s).","Enraged, it can walk over salt without disturbing it.","Wraith, Obambo, Demon."],
26:["Within 10 m during a hunt: standing still, it drops to 1.2 m/s; if you move, it goes up to 2.25 m/s.","Always female.","Kormos, Deogen, Revenant."],
27:["Timer from the first opening of an exit door: calm from 0 to 1 min, aggressive from 1 to 3, then switches every 2 min. Calm about 1.45 m/s, aggressive about 1.96 m/s.","Hunts started while aggressive are 20% shorter.","The Twins, Gallu, Hantu."],
28:["Almost blind during hunts: standing still and visible more than 5 m away, it ignores you. It speeds up toward your footsteps (up to about 3.7 m/s).","Never does the mist event or a chase event.","Dayan, Yokai, Oni, Banshee."],
29:["Slow base speed (about 1.53 m/s). When it sees you, it speeds up faster than any other ghost (about 2.53 m/s in 9 s). If it reaches you in an official hiding spot, the hunt stops dead.","The next hunt starts with no grace period, straight to your hiding spot.","The Twins (slow speed), Moroi."],
30:["3 m/s at the start of each hunt, minus 0.1 m/s for each different house object moved before the hunt (minimum 0.4). Doesn't speed up when it sees you.","The count resets after each hunt or burned crucifix.","Revenant, Deogen, Thaye, Moroi."]}},

cruxfl:["Kruzifix verbrannt, obwohl direkt daneben eine Flamme brannte"],third:["Jagd direkt nach der 3. ausgeblasenen Flamme"],lamp:["Meine Taschenlampe flackert, bevor ich seine Schritte höre","Gestrichen: Schritte zuerst gehört."],elec:["Schneller in der Nähe eingeschalteter Elektronik"],voice:["Reagierte bei der Jagd nicht auf meine Stimme aus 4 oder 5 m"],

orb:["Orb auf der Kamera sichtbar (Spiel mit 0 Beweisen)","Gestrichen: kein Orb nach langer Beobachtung."],th50:["Hat über 50 % Durchschnittsverstand gejagt"],th35:["Keine Jagd vor 35 % Durchschnittsverstand"]},
g:{0:["Räuchern, dann Timer: keine Jagd vor 180 s (90 s bei den anderen, 60 s beim Demon). 2- bis 3-mal wiederholen.","Kein anderes Zeichen: normales Tempo und Verhalten.","Shade (Anwesenheitstest), Demon (60 s)."],
1:["Geht über Salz, ohne es zu stören. Beweise den Gang: Jagd, Geisterereignis oder Melder direkt hinter der Linie. Vorher kein Kruzifix und kein Räucherwerk.","Teleport: EMF an den Füßen eines Spielers, weit weg von seinem Raum, ohne Interaktion.","Wütende Gallu (zertritt immer den ersten Haufen), Mimic."],
2:["Foto während eines Geisterereignisses: Er verschwindet sofort und ist nicht auf dem Foto.","Während der Jagd fast immer unsichtbar.","Obake (bleibt auf dem Foto)."],
3:["Mach einen Haufen aus etwa zehn Gegenständen in seinem Raum: Er wirft mehrere auf einmal.","Wirft während der Jagd fast ständig Gegenstände.","The Twins (zwei Interaktionen an zwei Orten), Deildegast."],
4:["Parabolmikrofon: typischer hoher Schrei. In der Gruppe ignoriert sie bei der Jagd einen sichtbaren Spieler, der nicht ihr Ziel ist.","Immer weiblich. Wechselt nie den Raum, wandert aber weit zu ihrem Ziel.","Kormos (ignoriert alle stillstehenden Spieler), Goryo."],
5:["Sicherungskasten an: Sieht er dich auf mehr als 3 m, springt er auf 2,5 m/s und wird bei dir langsamer. Sicherungskasten aus: normales Tempo.","Schaltet den Sicherungskasten nie selbst aus.","Raiju: Sicherungskasten aus, Elektronik an lassen."],
6:["Mach ein Licht an: Er schaltet es manchmal ein bis zwei Sekunden später aus. Er schaltet nie ein Licht ein.","Verlässt oder wechselt den Raum, wenn dort Licht an ist.","Goryo (bleibt auch bei Licht in seinem Raum)."],
7:["Versteckt, leise, Elektronik aus: sehr langsame Schritte (1 m/s), dann schlagartig 3 m/s, wenn er dich entdeckt.","Verliert er dich, rast er zu deiner letzten Position und wird dann wieder langsam.","Alter Thaye, Hantu im Warmen, Kormos, Deildegast."],
8:["Bleib mit ihr im selben Raum: Sie kann keine Jagd starten und interagiert kaum.","Sehr scheu, aktiver, wenn ihr weit weg seid.","Spirit (Räucherwerk 180 s), ruhiger Obambo, Goryo."],
9:["Räuchern, dann Timer: Jagd schon ab 60 s möglich (90 s bei den anderen).","Das Kruzifix wirkt auf ihn 50 % weiter.","Onryo (Flammen), junger Thaye, Gallu, aggressiver Obambo."],
10:["Räuchern in seinem Raum: Er bleibt dort 90 s gefangen. Salz und Melder an die Ausgänge.","Einziger, der die Haustür außerhalb von Jagd UND Ereignis schließt.","Goryo (kann in den 90 s raus), Shade."],
11:["Macht nie das Nebel-Ereignis.","Während der Jagd sehr sichtbar, sehr aktiv bei Spielern.","Kormos (auch kein Nebel, aber nie ein Verfolgungs-Ereignis)."],
12:["Hört deine Stimme bei der Jagd nur auf etwa 2,5 m: versteckt in 4 bis 5 m reden, er kommt nicht zu dir.","Außerhalb der Jagd macht ihn Reden in seiner Nähe aggressiver.","Kormos (reagiert auf Schritte, nicht auf Stimme)."],
13:["Tempo hängt von der Temperatur ab: langsam im Warmen (etwa 1,4 m/s), schnell im Kalten (etwa 2,7 m/s). Wird nicht schneller, wenn er dich sieht.","Sicherungskasten aus: kalter Atem während der Jagd sichtbar.","Revenant, ruhiger Obambo."],
14:["Macht nur kurze Streifzüge: Melder mehr als 4 m von seinem Raum lösen außerhalb von Jagd und Ereignis nie aus. Wechselt nie den Raum.","Ohne Beweise kein 100-%-Test: Er bleibt übrig, wenn alles andere ausgeschlossen ist.","Banshee, Yurei, Shade."],
15:["Taschenlampe bei der Jagd an: Sie flackert, bevor du seine Schritte hörst (hörbar auf etwa 12 m statt 20 m).","Macht mehr Geräusche im Parabolmikrofon.","Raiju (schneller bei Elektronik), Revenant."],
16:["Brennende Kerze und Kruzifix nebeneinander: Er bläst die Kerze aus, statt zu jagen, das Kruzifix brennt nicht. Nach der 3. ausgeblasenen Flamme jagt er.","Kerze jedes Mal neu anzünden, um mitzuzählen.","Demon (jagt oft, die Flamme stoppt ihn nicht)."],
17:["Anderes Tempo von Jagd zu Jagd (etwa 1,5 oder 1,9 m/s), zufällig.","Zwei Interaktionen fast gleichzeitig an zwei Orten.","Obambo (sein Tempo folgt einem Timer), Poltergeist."],
18:["Eingeschaltete Elektronik auf seinem Weg: Er wird dort 2,5 m/s schnell, auch ohne dich zu sehen.","Lässt deine Elektronik aus größerer Entfernung flackern.","Jinn (hängt vom Sicherungskasten ab), Myling, Dayan."],
19:["Ändert während der Jagd sein Aussehen.","Abdrücke mit 6 Fingern, die schneller verblassen (wenn UV aktiv).","Phantom (verschwindet auf dem Foto)."],
20:["Zeigt immer Orbs auf der Kamera, auch bei 0 Beweisen. Stell eine Kamera in seinen Raum.","Kopiert die Fähigkeiten anderer Geister und wechselt im Spiel das Modell.","Alle Geister."],
21:["Bei 0 %: schnell ohne dich zu sehen (etwa 2,3 m/s), dann bis etwa 3,7 m/s, wenn er dich sieht.","Räucherwerk bei der Jagd: 7,5, 9 oder 10,5 s geblendet statt 5, 6 oder 7 s (Stufe I, II, III).","Dayan, junger Thaye, Kormos, Deildegast, Aswang."],
22:["Von weitem sehr schnell (3 m/s), direkt bei dir fast stehend (0,4 m/s).","Weiß immer, wo die Spieler sind: Verstecken bringt nichts.","Revenant (das Gegenteil), Dayan."],
23:["Früh im Spiel schnell (etwa 2,75 m/s), wird dann mit dem Alter langsamer, bis 1 m/s. Wird nie schneller, wenn er dich sieht.","Er altert, wenn ihr in seiner Nähe bleibt. Das Ouija kostet Verstand: bei 0 % droht eine verfluchte Jagd.","Deildegast (Gegenstände), Obambo, Deogen."],
25:["Ohne Kruzifix, Räucherwerk oder Salz: normales Tempo. Nach einem Schutz: wütend und schneller (etwa 1,96 m/s, bis 3,2 m/s). Nach einer wütenden Jagd: geschwächt und langsamer (etwa 1,36 m/s).","Wütend kann sie über Salz gehen, ohne es zu stören.","Wraith, Obambo, Demon."],
26:["Innerhalb von 10 m bei der Jagd: Stehst du still, fällt sie auf 1,2 m/s; bewegst du dich, steigt sie auf 2,25 m/s.","Immer weiblich.","Kormos, Deogen, Revenant."],
27:["Timer ab dem ersten Öffnen einer Ausgangstür: ruhig von 0 bis 1 Min., aggressiv von 1 bis 3, dann Wechsel alle 2 Min. Ruhig etwa 1,45 m/s, aggressiv etwa 1,96 m/s.","Im aggressiven Zustand gestartete Jagden sind 20 % kürzer.","The Twins, Gallu, Hantu."],
28:["Bei der Jagd fast blind: Stehst du still und sichtbar auf mehr als 5 m, ignoriert er dich. Wird zu deinen Schritten hin schneller (bis etwa 3,7 m/s).","Macht nie das Nebel- oder Verfolgungs-Ereignis.","Dayan, Yokai, Oni, Banshee."],
29:["Langsames Grundtempo (etwa 1,53 m/s). Sieht er dich, wird er schneller als jeder andere Geist (etwa 2,53 m/s in 9 s). Erreicht er dich in einem offiziellen Versteck, endet die Jagd sofort.","Die nächste Jagd beginnt ohne Schonfrist, direkt zu deinem Versteck.","The Twins (langsames Tempo), Moroi."],
30:["3 m/s zu Beginn jeder Jagd, minus 0,1 m/s für jeden verschiedenen Hausgegenstand, der vor der Jagd bewegt wurde (mindestens 0,4). Wird nicht schneller, wenn er dich sieht.","Der Zähler wird nach jeder Jagd oder jedem verbrannten Kruzifix zurückgesetzt.","Revenant, Deogen, Thaye, Moroi."]}},

g:{0:["Incenso, poi cronometro: nessuna caccia prima di 180 s (90 s per le altre, 60 s per il Demon). Ripeti 2 o 3 volte.","Nessun altro segno: velocità e comportamento normali.","Shade (test di presenza), Demon (60 s)."],
1:["Passa sul sale senza toccarlo. Prova il passaggio: caccia, evento o sensore subito dietro la linea. Niente crocifisso né incenso prima del test.","Teletrasporto: EMF ai piedi di un giocatore, lontano dalla sua stanza, senza interazione.","Gallu infuriata (calpesta sempre il primo mucchio), Mimic."],
2:["Foto durante un evento: sparisce subito e non appare nella foto.","Quasi sempre invisibile durante la caccia.","Obake (resta nella foto)."],
3:["Fai un mucchio di una decina di oggetti nella sua stanza: ne lancia diversi in una volta.","Lancia oggetti quasi senza sosta durante la caccia.","The Twins (due interazioni in due posti), Deildegast."],
4:["Microfono parabolico: urlo acuto tipico. In gruppo, durante la caccia, ignora un giocatore visibile che non è il suo bersaglio.","Sempre femminile. Non cambia mai stanza ma va lontano per seguire il bersaglio.","Kormos (ignora tutti i giocatori fermi), Goryo."],
5:["Quadro acceso: se ti vede a più di 3 m, scatta a 2,5 m/s, poi rallenta vicino a te. Quadro spento: velocità normale.","Non spegne mai il quadro da solo.","Raiju: spegni il quadro e tieni accesa l'elettronica."],
6:["Accendi una luce: a volte la spegne uno o due secondi dopo. Non accende mai una luce.","Lascia o cambia stanza quando la luce è accesa.","Goryo (resta nella sua stanza anche con la luce)."],
7:["Nascosto, in silenzio, elettronica spenta: passi lentissimi (1 m/s), poi 3 m/s di colpo quando ti individua.","Quando ti perde, corre alla tua ultima posizione, poi torna lento.","Thaye vecchio, Hantu al caldo, Kormos, Deildegast."],
8:["Resta nella sua stessa stanza: non può iniziare una caccia e interagisce pochissimo.","Molto timida, più attiva quando siete lontani.","Spirit (incenso 180 s), Obambo calmo, Goryo."],
9:["Incenso, poi cronometro: caccia possibile già da 60 s (90 s per le altre).","Il crocifisso agisce su di lui il 50% più lontano.","Onryo (fiamme), Thaye giovane, Gallu, Obambo aggressivo."],
10:["Incenso nella sua stanza: resta bloccato lì 90 s. Metti sale e sensori alle uscite.","Unico a chiudere la porta d'ingresso fuori caccia E fuori evento.","Goryo (può uscire nei 90 s), Shade."],
11:["Non fa mai l'evento nebbia.","Molto visibile durante la caccia, molto attivo vicino ai giocatori.","Kormos (niente nebbia neanche lui, ma mai un inseguimento)."],
12:["In caccia sente la tua voce solo a circa 2,5 m: nascosto a 4 o 5 m, parla, non viene verso di te.","Fuori caccia, parlargli vicino lo rende più aggressivo.","Kormos (reagisce ai passi, non alla voce)."],
13:["Velocità legata alla temperatura: lento al caldo (circa 1,4 m/s), veloce al freddo (circa 2,7 m/s). Non accelera quando ti vede.","Quadro spento: respiro freddo visibile in caccia.","Revenant, Obambo calmo."],
14:["Fa solo brevi giri: i sensori a più di 4 m dalla sua stanza non scattano mai fuori caccia o evento. Non cambia mai stanza.","Nessun test al 100% senza prove: tienilo quando tutto il resto è escluso.","Banshee, Yurei, Shade."],
15:["Torcia accesa in caccia: lampeggia prima che tu senta i suoi passi (udibili a circa 12 m invece di 20 m).","Fa più rumori al microfono parabolico.","Raiju (accelera vicino all'elettronica), Revenant."],
16:["Candela accesa e crocifisso affiancati: spegne la candela invece di cacciare, il crocifisso non brucia. Dopo la 3ª fiamma spenta, caccia.","Riaccendi la candela ogni volta per tenere il conto.","Demon (caccia spesso, la fiamma non lo ferma)."],
17:["Velocità diversa da una caccia all'altra (circa 1,5 o 1,9 m/s), a caso.","Due interazioni quasi insieme in due posti.","Obambo (velocità a cronometro), Poltergeist."],
18:["Elettronica accesa sul suo percorso: lì va a 2,5 m/s, anche senza vederti.","Fa lampeggiare l'elettronica da più lontano delle altre.","Jinn (dipende dal quadro), Myling, Dayan."],
19:["Cambia aspetto durante la caccia.","Impronte a 6 dita che svaniscono prima (se l'UV è attivo).","Phantom (sparisce in foto)."],
20:["Mostra sempre orbi in videocamera, anche a 0 prove. Metti una videocamera nella sua stanza.","Copia le abilità delle altre entità e cambia modello durante la partita.","Tutte le entità."],
21:["A 0%: veloce senza vederti (circa 2,3 m/s), poi fino a circa 3,7 m/s quando ti vede.","Incenso in caccia: accecato 7,5, 9 o 10,5 s invece di 5, 6 o 7 s (livelli I, II, III).","Dayan, Thaye giovane, Kormos, Deildegast, Aswang."],
22:["Velocissimo da lontano (3 m/s), quasi fermo vicino a te (0,4 m/s).","Sa sempre dove sono i giocatori: nascondersi non serve.","Revenant (l'opposto), Dayan."],
23:["Veloce a inizio partita (circa 2,75 m/s), poi rallenta invecchiando fino a 1 m/s. Non accelera mai quando ti vede.","Invecchia quando restate vicino a lui. La Ouija costa sanità: a 0% rischi una caccia maledetta.","Deildegast (oggetti), Obambo, Deogen."],
25:["Senza crocifisso, incenso o sale: velocità normale. Dopo una protezione: infuriata e più veloce (circa 1,96 m/s, fino a 3,2 m/s). Dopo una caccia infuriata: indebolita e più lenta (circa 1,36 m/s).","Infuriata, può passare sul sale senza toccarlo.","Wraith, Obambo, Demon."],
26:["Entro 10 m in caccia: se resti fermo scende a 1,2 m/s; se ti muovi sale a 2,25 m/s.","Sempre femminile.","Kormos, Deogen, Revenant."],
27:["Cronometro dalla prima apertura di una porta d'uscita: calmo da 0 a 1 min, aggressivo da 1 a 3, poi cambia ogni 2 min. Calmo circa 1,45 m/s, aggressivo circa 1,96 m/s.","Le cacce iniziate da aggressivo durano il 20% in meno.","The Twins, Gallu, Hantu."],
28:["Quasi cieco in caccia: fermo e visibile a più di 5 m, ti ignora. Accelera verso i tuoi passi (fino a circa 3,7 m/s).","Non fa mai l'evento nebbia né un inseguimento.","Dayan, Yokai, Oni, Banshee."],
29:["Velocità di base lenta (circa 1,53 m/s). Quando ti vede accelera più di ogni altra entità (circa 2,53 m/s in 9 s). Se ti raggiunge in un nascondiglio ufficiale, la caccia si ferma di colpo.","La caccia successiva parte senza periodo di grazia, dritta al tuo nascondiglio.","The Twins (velocità lenta), Moroi."],
30:["3 m/s all'inizio di ogni caccia, meno 0,1 m/s per ogni oggetto diverso della casa spostato prima della caccia (minimo 0,4). Non accelera quando ti vede.","Il conteggio si azzera dopo ogni caccia o crocifisso bruciato.","Revenant, Deogen, Thaye, Moroi."]}},

$("#fs").addEventListener("input",()=>drawObs(calc().filter(x=>!x.why.length)));
const SEL=()=>[["start",U("lStart"),[[0,"0 %"],[25,"25 %"],[50,"50 %"],[75,"75 %"],[100,"100 %"]]],
["pills",U("lPills"),[[0,U("oNone")],[1,U("oYes")]]],
["drain",U("lDrain"),[[0,U("oNone")],[0.5,U("oSlow")],[1,U("oNormal")],[2,U("oFast")]]],
["ev",U("lEv"),[[0,"0"],[1,"1"],[2,"2"],[3,"3"]]],
["fuse",U("lFuse"),[["ok",U("oFuseOk")],["broken",U("oFuseBroken")]]],
["pl",U("lPl"),[["solo",U("oSolo")],["group",U("oGroup")]]]];
function drawSets(){const s=st.set;
  $("#sets").innerHTML='<div class="sgr">'+SEL().map(f=>'<label class="fld"><span>'+f[1]+'</span><select data-s="'+f[0]+'">'+f[2].map(o=>'<option value="'+o[0]+'"'+(String(s[f[0]])===String(o[0])?" selected":"")+'>'+o[1]+'</option>').join("")+'</select></label>').join("")+'</div>'+
  '<div class="eqt">'+U("eqTitle")+'</div><div class="eqs">'+EQ.map(e=>'<label class="eqc"><input type="checkbox" data-eq="'+e[0]+'"'+(s.eq[e[0]]?" checked":"")+'> '+EQT(e[0])+'</label>').join("")+'</div><p class="sinfo">'+info()+'</p>';
  $("#setsum").textContent=U("sum")(s)}
function info(){const s=st.set,m=[];
  if(st.zero)m.push(U("iZero"));
  else if(+s.drain===0)m.push(U("iDrain0"));
  else m.push(U("iNorm"));
  if(+s.ev>0)m.push(U("iEv"));
  if(s.fuse==="broken")m.push(U("iFuse"));
  if(s.pl==="solo")m.push(U("iSolo"));
  return m.join(" ")}
$("#sets").addEventListener("change",e=>{const el=e.target;
  if(el.dataset.s){const v=el.value;st.set[el.dataset.s]=isNaN(+v)?v:+v}
  if(el.dataset.eq)st.set.eq[el.dataset.eq]=el.checked?1:0;
  fixSet();save();drawSets();draw()});
function applyStatic(){document.documentElement.lang=st.lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=U(el.dataset.i);if(typeof v==="string")el.textContent=v});
  document.querySelectorAll("[data-ip]").forEach(el=>{el.placeholder=U(el.dataset.ip)});
  $("#lng").innerHTML=LANGS.map(l=>'<option value="'+l[0]+'"'+(l[0]===st.lang?" selected":"")+'>'+l[1]+'</option>').join("");
  idFind()}
$("#lng").addEventListener("change",e=>{st.lang=e.target.value;save();applyStatic();drawSets();draw()});
applyStatic();
drawSets();
$("#mim").addEventListener("change",e=>{st.mim=e.target.checked;save();draw()});
$("#reset").addEventListener("click",()=>{st.on={};st.man={};save();draw()});
$("#q").addEventListener("input",idFind);
draw();
}
</script>
</body>
</html>
